// Spawn lively monster packs in EVERY room and MOST corridors!
function populateMonsters() {
  const lvlScale = 1 + (depth - 1) * 0.14;

  function addMonster(type, wx, wz, roomId) {
    const meshObj = buildMonsterMesh(type);
    meshObj.root.position.set(wx, 0, wz);
    levelGroup.add(meshObj.root);

    const stats = {
      skeleton: { hp: Math.round(34 * lvlScale), speed: 2.65, dmg: 1, range: 1.42, cd: 1.15, radius: 0.42, gold: [4, 9] },
      rat:      { hp: Math.round(22 * lvlScale), speed: 3.45, dmg: 1, range: 1.15, cd: 0.92, radius: 0.34, gold: [2, 6] },
      slime:    { hp: Math.round(30 * lvlScale), speed: 1.95, dmg: 1, range: 1.25, cd: 1.25, radius: 0.46, gold: [3, 7] },
      boss:     { hp: Math.round(135 * lvlScale), speed: 2.35, dmg: 2, range: 2.15, cd: 1.45, radius: 0.72, gold: [28, 45] },
    }[type];

    level.monsters.push({
      type,
      x: wx, z: wz,
      homeX: wx, homeZ: wz,
      vx: 0, vz: 0,
      yaw: Math.random() * Math.PI * 2,
      radius: stats.radius,
      hp: stats.hp,
      maxHp: stats.hp,
      speed: stats.speed,
      dmg: stats.dmg,
      attackRange: stats.range,
      attackCdMax: stats.cd,
      attackCd: 0.35 + Math.random() * 0.4,
      windup: 0,
      attackAnim: 0,
      hitFlash: 0,
      walkPhase: Math.random() * Math.PI * 2,
      patrolTimer: Math.random() * 2.5,
      patrolX: wx, patrolZ: wz,
      aggro: false,
      dead: false,
      roomId,
      goldRange: stats.gold,
      meshObj,
    });
  }

  function pickMonsterType() {
    const r = Math.random();
    if (r < 0.44) return 'skeleton';
    if (r < 0.78) return 'rat';
    return 'slime';
  }

  function findOpenSpotInRoom(r, minDistFromHero = 0) {
    for (let t = 0; t < 24; t++) {
      const gx = r.x + 1 + Math.floor(Math.random() * Math.max(1, r.w - 2));
      const gy = r.y + 1 + Math.floor(Math.random() * Math.max(1, r.h - 2));
      if (!isTileWalkable(gx, gy, false)) continue;
      const wx = (gx + 0.5) * TILE + (Math.random() - 0.5) * 0.5;
      const wz = (gy + 0.5) * TILE + (Math.random() - 0.5) * 0.5;
      if (minDistFromHero > 0 && Math.hypot(wx - hero.x, wz - hero.z) < minDistFromHero) continue;
      let blocked = false;
      for (const obs of level.solidCircles) if (Math.hypot(wx - obs.x, wz - obs.z) < obs.r + 0.6) { blocked = true; break; }
      for (const m of level.monsters) if (Math.hypot(wx - m.x, wz - m.z) < 1.35) { blocked = true; break; }
      if (!blocked) return [wx, wz];
    }
    return [(r.cx + 0.5) * TILE, (r.cy + 0.5) * TILE];
  }

  for (const r of level.rooms) {
    if (r.role === 'start') {
      // Spawn 2 monsters right on the far edge of the starting chamber so action starts immediately!
      for (let i = 0; i < 2; i++) {
        const [wx, wz] = findOpenSpotInRoom(r, 3.6);
        addMonster(i === 0 ? 'skeleton' : 'rat', wx, wz, r.id);
      }
      continue;
    }
    if (r.role === 'boss') {
      const bx = (r.cx + 0.5) * TILE, bz = (r.cy + 0.5) * TILE;
      addMonster('boss', bx, bz, r.id);
      // Boss retinue (2 minions)
      for (let i = 0; i < 2; i++) {
        const [wx, wz] = findOpenSpotInRoom(r, 0);
        if (Math.hypot(wx - bx, wz - bz) > 1.8) addMonster('skeleton', wx, wz, r.id);
      }
      continue;
    }
    if (r.role === 'stairs') {
      // Stair chamber guardians (2 fierce monsters waiting past the locked door)
      for (let i = 0; i < 2; i++) {
        const [wx, wz] = findOpenSpotInRoom(r, 0);
        addMonster(i === 0 ? 'skeleton' : 'slime', wx, wz, r.id);
      }
      continue;
    }

    // Normal & Key Rooms: 3 to 4 active monsters per room!
    const count = (r.role === 'key') ? 4 : (3 + (Math.random() < 0.45 ? 1 : 0));
    for (let i = 0; i < count; i++) {
      const [wx, wz] = findOpenSpotInRoom(r, 0);
      addMonster(pickMonsterType(), wx, wz, r.id);
    }
  }

  // Corridor Patrol Monsters: populate most corridors so there is NEVER a dull empty stretch!
  const corridorSpawns = [];
  for (let gy = 2; gy < GRID_H - 2; gy++) {
    for (let gx = 2; gx < GRID_W - 2; gx++) {
      if (level.grid[gy][gx] !== T_FLOOR || level.roomIdGrid[gy][gx] !== -1) continue;
      const wx = (gx + 0.5) * TILE, wz = (gy + 0.5) * TILE;
      if (Math.hypot(wx - hero.x, wz - hero.z) < 4.5) continue;
      let tooClose = false;
      for (const m of level.monsters) {
        if (Math.hypot(m.x - wx, m.z - wz) < 4.6) { tooClose = true; break; }
      }
      for (const s of corridorSpawns) {
        if (Math.hypot(s[0] - wx, s[1] - wz) < 5.0) { tooClose = true; break; }
      }
      if (!tooClose && Math.random() < 0.34) {
        corridorSpawns.push([wx, wz]);
        addMonster(pickMonsterType(), wx, wz, -1);
      }
    }
  }
}

function startLevel(newDepth, isInitial = false) {
  depth = newDepth;
  level = generateDungeon(depth);
  const startRoom = level.rooms[0];
  hero.x = (startRoom.cx + 0.5) * TILE;
  hero.z = (startRoom.cy + 0.5) * TILE;
  hero.vx = 0; hero.vz = 0;
  hero.aiPath = [];
  hero.aiTargetRoom = -1;
  hero.aiStuckTimer = 0;
  hero.aiLastCheckX = hero.x;
  hero.aiLastCheckZ = hero.z;

  // Between floors, grant a small respite heal (1 heart) & ensure at least 1 potion
  if (!isInitial) {
    hero.hp = Math.min(hero.maxHp, hero.hp + 2);
    if (hero.potions < 1) hero.potions = 1;
  }

  populateMonsters();
  heroMesh.root.position.set(hero.x, 0, hero.z);
  camTarget.set(hero.x, 0.85, hero.z);
  camera.position.copy(camTarget).add(CAM_OFFSET);
  camera.lookAt(camTarget);

  bossBarWrap.classList.remove('visible');
  updateHUD();

  const subtitle = level.isBossFloor
    ? `DEPTH ${romanNumeral(depth)} · BOSS CHAMBER`
    : `DEPTH ${romanNumeral(depth)}`;
  showBanner(isInitial ? 'TORCHLIGHT DEPTHS' : `DESCENDING TO DEPTH ${depth}`, subtitle, isInitial ? 3200 : 2400);
}

/* ==========================================================================
   10. INPUT (WASD, ARROWS, SPACE, GAMEPAD) + SEAMLESS AUTO-RESUME
   ========================================================================== */
const keys = new Set();
let manualAttackQueued = false;

function markManualInput() {
  lastManualInputTime = elapsed;
  if (!manualMode) {
    manualMode = true;
    modePillEl.textContent = 'MANUAL · WASD / SPACE';
    modePillEl.classList.add('manual');
  }
}

window.addEventListener('keydown', (e) => {
  sfx.unlock();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) {
    e.preventDefault();
  }
  keys.add(e.code);
  if (['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) {
    markManualInput();
  }
  if (e.code === 'Space' || e.code === 'KeyJ') {
    markManualInput();
    manualAttackQueued = true;
  }
  if (e.code === 'KeyQ' || e.code === 'KeyH') {
    markManualInput();
    tryDrinkPotion();
  }
});

window.addEventListener('keyup', (e) => {
  keys.delete(e.code);
});

// Sound unlock on any click / touch; sound pill toggles mute cleanly without pointerdown race
const soundPill = document.getElementById('sound-pill');
soundPill.addEventListener('click', (e) => {
  e.stopPropagation();
  sfx.toggleMute();
});
window.addEventListener('pointerdown', (e) => {
  if (e.target && e.target.closest && e.target.closest('#sound-pill')) return;
  if (!sfx.enabled) sfx.unlock();
});

function pollManualControls() {
  let ix = 0, iy = 0; // screen-space right (+ix) and up (+iy)
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  ix -= 1;
  if (keys.has('KeyW') || keys.has('ArrowUp'))    iy += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown'))  iy -= 1;

  // HTML5 Gamepad support
  let gpAttack = false;
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of pads) {
    if (!gp) continue;
    const ax = Math.abs(gp.axes[0] || 0) > 0.22 ? gp.axes[0] : 0;
    const ay = Math.abs(gp.axes[1] || 0) > 0.22 ? -gp.axes[1] : 0;
    if (ax !== 0 || ay !== 0) { ix += ax; iy += ay; markManualInput(); sfx.unlock(); }
    // D-pad buttons 12..15
    if (gp.buttons[12]?.pressed) { iy += 1; markManualInput(); }
    if (gp.buttons[13]?.pressed) { iy -= 1; markManualInput(); }
    if (gp.buttons[14]?.pressed) { ix -= 1; markManualInput(); }
    if (gp.buttons[15]?.pressed) { ix += 1; markManualInput(); }
    if (gp.buttons[0]?.pressed || gp.buttons[1]?.pressed || gp.buttons[2]?.pressed || gp.buttons[5]?.pressed) {
      gpAttack = true; markManualInput(); sfx.unlock();
    }
    if (gp.buttons[3]?.pressed) { tryDrinkPotion(); markManualInput(); }
  }

  if (ix !== 0 || iy !== 0) markManualInput();

  // Map screen axes -> isometric world axes!
  // Camera offset is (+1, +y, +1): screen UP = (-X, -Z), screen RIGHT = (+X, -Z)
  let wx = 0, wz = 0;
  const mag = Math.hypot(ix, iy);
  if (mag > 0.05) {
    const nx = ix / Math.max(1, mag);
    const ny = iy / Math.max(1, mag);
    const invSqrt2 = 0.70710678;
    wx = (nx - ny) * invSqrt2;
    wz = (-nx - ny) * invSqrt2;
  }

  const attack = manualAttackQueued || gpAttack || keys.has('Space');
  manualAttackQueued = false;
  return { wx, wz, attack };
}

/* ==========================================================================
   11. COMBAT, LOOT, DOORS, TRAPS & SELF-PLAYING AI
   ========================================================================== */
function tryDrinkPotion() {
  if (hero.potions <= 0 || hero.hp >= hero.maxHp) return false;
  hero.potions--;
  hero.hp = Math.min(hero.maxHp, hero.hp + 5);
  hero.healGlow = 0.85;
  sfx.potion();
  updateHUD('healed');
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    spawnEmber(
      hero.x + Math.cos(a) * 0.4, 0.4 + Math.random() * 0.7, hero.z + Math.sin(a) * 0.4,
      Math.cos(a) * 0.6, 1.8 + Math.random() * 1.2, Math.sin(a) * 0.6,
      0.85, false, 0.45, 1.0, 0.58
    );
  }
  return true;
}

function damageHero(amount, srcX, srcZ) {
  if (hero.invulnTimer > 0 || descending) return;
  hero.hp = Math.max(0, hero.hp - amount);
  hero.flinchTimer = 0.28;
  hero.invulnTimer = 0.72;
  camShake.mag = Math.max(camShake.mag, amount >= 2 ? 0.28 : 0.16);
  sfx.heroHit();
  updateHUD('hurt');

  const dx = hero.x - srcX, dz = hero.z - srcZ;
  const d = Math.hypot(dx, dz) || 1;
  hero.vx += (dx / d) * 6.5;
  hero.vz += (dz / d) * 6.5;

  // Sparks on armor hit
  for (let i = 0; i < 8; i++) {
    spawnEmber(hero.x, 0.9, hero.z, (Math.random() - 0.5) * 4, 1.5 + Math.random() * 2.5, (Math.random() - 0.5) * 4, 0.45, false, 1.0, 0.32, 0.22);
  }

  // If hero somehow drops to 0 HP: rally with a dramatic phoenix ember surge (or drink emergency potion)
  // so the endless watchable dungeon expedition never halts!
  if (hero.hp <= 0) {
    if (hero.potions > 0) {
      hero.potions--;
      hero.hp = 6;
      sfx.potion();
      updateHUD('healed');
      showBanner('SECOND WIND', 'POTION SAVED THE ADVENTURER', 1800);
    } else {
      hero.hp = hero.maxHp;
      hero.potions = 2;
      hero.invulnTimer = 1.8;
      // Blast nearby monsters back in a golden flame burst
      for (const m of level.monsters) {
        if (m.dead) continue;
        const md = Math.hypot(m.x - hero.x, m.z - hero.z);
        if (md < 4.5) {
          m.vx += ((m.x - hero.x) / (md || 1)) * 10;
          m.vz += ((m.z - hero.z) / (md || 1)) * 10;
        }
      }
      for (let i = 0; i < 28; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1.5 + Math.random() * 4;
        spawnEmber(hero.x, 0.8, hero.z, Math.cos(a) * s, 2 + Math.random() * 2.5, Math.sin(a) * s, 0.9, false, 1.0, 0.72, 0.25);
      }
      updateHUD('healed');
      showBanner('FLAME REKINDLED', 'THE TORCH REFUSES TO DIE', 2000);
    }
  }
}

function startHeroAttack(aimYaw = null) {
  if (hero.attackCooldown > 0 || descending) return;
  if (aimYaw !== null) hero.yaw = aimYaw;
  hero.attackAnim = 0.001;
  hero.attackCooldown = 0.44;
  hero.attackDidHit = false;
  sfx.swordSwing();
}

function performHeroSwordStrike() {
  const reach = 2.08;
  const fx = Math.sin(hero.yaw);
  const fz = Math.cos(hero.yaw);
  spawnSlashArc(hero.x + fx * 0.35, 0.82, hero.z + fz * 0.35, hero.yaw, 1.68, 0xffe4b0, false);

  let hitAny = false;
  const baseDmg = 14 + Math.floor((depth - 1) * 2.2);

  for (const m of level.monsters) {
    if (m.dead) continue;
    const dx = m.x - hero.x;
    const dz = m.z - hero.z;
    const dist = Math.hypot(dx, dz);
    if (dist > reach + m.radius) continue;
    const dot = (dx * fx + dz * fz) / (dist || 1);
    if (dot < -0.15 && dist > 0.95) continue;

    // Deal damage + knockback + hit flash!
    m.hp -= baseDmg;
    m.hitFlash = 0.22;
    m.aggro = true;
    const kb = m.type === 'boss' ? 4.2 : 8.4;
    m.vx += (dx / (dist || 1)) * kb;
    m.vz += (dz / (dist || 1)) * kb;
    hitAny = true;

    sfx.hitEnemy(m.type);
    for (let i = 0; i < 8; i++) {
      spawnEmber(
        m.x, 0.75, m.z,
        (Math.random() - 0.5) * 4.5 + (dx / (dist || 1)) * 2,
        1.5 + Math.random() * 2.6,
        (Math.random() - 0.5) * 4.5 + (dz / (dist || 1)) * 2,
        0.42, false, 1.0, 0.74, 0.3
      );
    }

    if (m.hp <= 0) {
      killMonster(m);
    }
  }

  if (hitAny) {
    camShake.mag = Math.max(camShake.mag, 0.12);
  }
}

function killMonster(m) {
  m.dead = true;
  hero.slain++;
  levelGroup.remove(m.meshObj.root);
  sfx.enemyDie(m.type);

  const kind = m.type === 'slime' ? 'goo' : (m.type === 'rat' ? 'rat' : 'bone');
  spawnDebrisBurst(m.x, 0.55, m.z, kind, m.type === 'boss' ? 18 : 9);

  // Drop gold coins
  const goldAmt = m.goldRange[0] + Math.floor(Math.random() * (m.goldRange[1] - m.goldRange[0] + 1));
  const coinCount = m.type === 'boss' ? 7 : (1 + (Math.random() < 0.5 ? 1 : 0));
  for (let c = 0; c < coinCount; c++) {
    level.spawnPickup(
      m.x + (Math.random() - 0.5) * 0.85,
      m.z + (Math.random() - 0.5) * 0.85,
      'gold',
      Math.max(1, Math.round(goldAmt / coinCount))
    );
  }

  // Occasional potion drop (guaranteed from boss!)
  if (m.type === 'boss' || (hero.potions < 3 && Math.random() < 0.16)) {
    level.spawnPickup(m.x + 0.45, m.z - 0.35, 'potion', 1);
  }

  // Boss drops the Dungeon Key!
  if (m.type === 'boss') {
    camShake.mag = 0.36;
    bossBarWrap.classList.remove('visible');
    if (!level.hasKey) {
      level.spawnPickup(m.x, m.z, 'key', 1);
    }
    showBanner('CRYPT WARDEN SLAIN', 'THE DUNGEON KEY DROPS TO THE STONES', 2800);
  }

  updateHUD();
}

function triggerDescend() {
  if (descending) return;
  descending = true;
  sfx.stairsDescend();
  fadeVeilEl.classList.add('dark');
  setTimeout(() => {
    startLevel(depth + 1, false);
    setTimeout(() => {
      fadeVeilEl.classList.remove('dark');
      descending = false;
    }, 180);
  }, 460);
}

// =========================================================================
// SELF-PLAYING HERO AI (Explores, Fights, Loots, Drinks, Unlocks, Descends!)
// =========================================================================
function updateHeroAI(dt) {
  // 1. Drink potion proactively when hurt!
  if (hero.hp <= 5 && hero.potions > 0) {
    tryDrinkPotion();
  }

  // Track room visitation
  const hgx = Math.floor(hero.x / TILE);
  const hgz = Math.floor(hero.z / TILE);
  const curRoomId = level.roomIdGrid[hgz]?.[hgx] ?? -1;
  if (curRoomId >= 0) level.rooms[curRoomId].visited = true;

  // Stuck watchdog
  hero.aiStuckTimer += dt;
  if (hero.aiStuckTimer >= 0.85) {
    const moved = Math.hypot(hero.x - hero.aiLastCheckX, hero.z - hero.aiLastCheckZ);
    hero.aiLastCheckX = hero.x;
    hero.aiLastCheckZ = hero.z;
    hero.aiStuckTimer = 0;
    if (moved < 0.25 && hero.attackAnim === 0) {
      // Unstick cleanly by resetting path and nudging toward center of current walkable tile
      hero.aiPath = [];
      hero.aiPathTimer = 0;
      const [wx, wz] = findNearestWalkableTile(hero.x, hero.z, level.hasKey);
      hero.aiPath.push({ x: (wx + 0.5) * TILE, z: (wz + 0.5) * TILE });
      hero.aiStrafeDir *= -1;
    }
  }

  // 2. Find nearest active threat (aggressive engagement keeps sword fights constant!)
  let nearestMonster = null;
  let bestMonsterDist = 999;
  for (const m of level.monsters) {
    if (m.dead) continue;
    // Skip monsters sealed behind locked door before we have the key
    if (!level.hasKey && m.roomId === level.stairRoomIdx) continue;
    const d = Math.hypot(m.x - hero.x, m.z - hero.z);
    const sameRoom = (curRoomId >= 0 && m.roomId === curRoomId);
    const rangeCap = (sameRoom || m.aggro) ? 13.5 : 8.5;
    if (d < rangeCap && d < bestMonsterDist && (sameRoom || m.aggro || hasLineOfSight(hero.x, hero.z, m.x, m.z))) {
      bestMonsterDist = d;
      nearestMonster = m;
    }
  }

  if (nearestMonster) {
    const dx = nearestMonster.x - hero.x;
    const dz = nearestMonster.z - hero.z;
    const dist = Math.hypot(dx, dz) || 0.001;
    const aimYaw = Math.atan2(dx, dz);
    const strikeDist = 1.62 + nearestMonster.radius;

    if (dist <= strikeDist) {
      // Face enemy & strike!
      if (hero.attackCooldown <= 0) {
        startHeroAttack(aimYaw);
      }
      // Subtle nimble footwork during swing cooldown
      const strafeAng = aimYaw + Math.PI * 0.5 * hero.aiStrafeDir;
      const holdFactor = dist < strikeDist * 0.62 ? -0.45 : 0.15;
      return {
        wx: (dx / dist) * holdFactor + Math.sin(strafeAng) * 0.35,
        wz: (dz / dist) * holdFactor + Math.cos(strafeAng) * 0.35,
        aimYaw,
      };
    }

    // Approach enemy cleanly
    if (hasLineOfSight(hero.x, hero.z, nearestMonster.x, nearestMonster.z)) {
      return { wx: dx / dist, wz: dz / dist, aimYaw };
    }
    return steerAlongAStar(nearestMonster.x, nearestMonster.z, dt, level.hasKey);
  }

  // 3. Collect nearby Key, Potion, or Gold
  let bestPickup = null;
  let bestPickupD = 999;
  for (const p of level.pickups) {
    if (p.collected) continue;
    const d = Math.hypot(p.x - hero.x, p.z - hero.z);
    const cap = p.type === 'key' ? 14.0 : 7.5;
    if (d < cap && d < bestPickupD) {
      bestPickupD = d;
      bestPickup = p;
    }
  }
  if (bestPickup) {
    return steerAlongAStar(bestPickup.x, bestPickup.z, dt, level.hasKey);
  }

  // 4. Open nearby unopened treasure chest
  let bestChest = null;
  let bestChestD = 999;
  for (const ch of level.chests) {
    if (ch.opened) continue;
    const d = Math.hypot(ch.wx - hero.x, ch.wz - hero.z);
    if (d < 8.5 && d < bestChestD) {
      bestChestD = d;
      bestChest = ch;
    }
  }
  if (bestChest) {
    return steerAlongAStar(bestChest.wx, bestChest.wz, dt, level.hasKey);
  }

  // 5. High-level Goal Selection (Room-by-Room Exploration -> Key -> Locked Door -> Stairs!)
  let goalX = null, goalZ = null;

  if (level.hasKey) {
    // Check if there's an unvisited non-stair room very close, otherwise head to Stairs!
    const sx = (level.stairTile.gx + 0.5) * TILE;
    const sz = (level.stairTile.gy + 0.5) * TILE;
    goalX = sx; goalZ = sz;
  } else {
    // Explore unvisited normal/key rooms room-by-room (nearest unvisited first, saving Key/Boss room cleanly in natural progression!)
    let bestRoom = null;
    let bestRoomScore = 99999;
    for (const r of level.rooms) {
      if (r.role === 'stairs' || r.visited) continue;
      const rx = (r.cx + 0.5) * TILE, rz = (r.cy + 0.5) * TILE;
      const d = Math.hypot(rx - hero.x, rz - hero.z);
      // Slight preference to clear normal rooms nearby before key room, making dungeon exploration thorough!
      const penalty = (r.role === 'key' || r.role === 'boss') ? 4.5 : 0;
      if (d + penalty < bestRoomScore) {
        bestRoomScore = d + penalty;
        bestRoom = r;
      }
    }

    if (bestRoom) {
      goalX = (bestRoom.cx + 0.5) * TILE;
      goalZ = (bestRoom.cy + 0.5) * TILE;
    } else {
      // All non-stair rooms visited: go straight to uncollected Key, or alive Boss, or any remaining monster!
      const keyPickup = level.pickups.find((p) => !p.collected && p.type === 'key');
      const boss = level.monsters.find((m) => !m.dead && m.type === 'boss');
      if (keyPickup) {
        goalX = keyPickup.x; goalZ = keyPickup.z;
      } else if (boss) {
        goalX = boss.x; goalZ = boss.z;
      } else {
        const kr = level.rooms[level.keyRoomIdx];
        goalX = (kr.cx + 0.5) * TILE;
        goalZ = (kr.cy + 0.5) * TILE;
      }
    }
  }

  return steerAlongAStar(goalX, goalZ, dt, level.hasKey);
}

function steerAlongAStar(goalX, goalZ, dt, allowLocked) {
  hero.aiPathTimer -= dt;
  if (hero.aiPathTimer <= 0 || hero.aiPath.length === 0) {
    const p = findPathAStar(hero.x, hero.z, goalX, goalZ, allowLocked);
    hero.aiPath = p || [{ x: goalX, z: goalZ }];
    hero.aiPathTimer = 0.42;
  }

  while (hero.aiPath.length > 1 && Math.hypot(hero.aiPath[0].x - hero.x, hero.aiPath[0].z - hero.z) < 0.72) {
    hero.aiPath.shift();
  }
  const wp = hero.aiPath[0] || { x: goalX, z: goalZ };
  const dx = wp.x - hero.x;
  const dz = wp.z - hero.z;
  const dist = Math.hypot(dx, dz) || 1;

  // Pause briefly if right in front of an active/warning spike trap!
  for (const tr of level.traps) {
    if (tr.type === 'spike' && (tr.active || tr.warn)) {
      const aheadX = hero.x + (dx / dist) * 0.95;
      const aheadZ = hero.z + (dz / dist) * 0.95;
      if (Math.hypot(aheadX - tr.wx, aheadZ - tr.wz) < 0.78 && Math.hypot(hero.x - tr.wx, hero.z - tr.wz) > 0.72) {
        return { wx: 0, wz: 0, aimYaw: Math.atan2(dx, dz) };
      }
    }
  }

  return { wx: dx / dist, wz: dz / dist, aimYaw: Math.atan2(dx, dz) };
}

/* ==========================================================================
   12. PER-FRAME SIMULATION UPDATE (Hero, Monsters, Props, Lights, Particles)
   ========================================================================== */
function updateSimulation(dt) {
  elapsed += dt;
  if (descending) return;

  // Auto-resume AI after 4.2s of no manual input
  const manual = pollManualControls();
  if (manualMode && (elapsed - lastManualInputTime > 4.2)) {
    manualMode = false;
    modePillEl.textContent = 'WASD / ARROWS · SPACE';
    modePillEl.classList.remove('manual');
    hero.aiPath = [];
  }

  let moveX = 0, moveZ = 0, aimYaw = null;
  if (manualMode) {
    moveX = manual.wx;
    moveZ = manual.wz;
    if (manual.attack) startHeroAttack(null);
  } else {
    const ai = updateHeroAI(dt);
    moveX = ai.wx;
    moveZ = ai.wz;
    aimYaw = ai.aimYaw;
  }

  // Hero movement & physics
  const heroSpeed = 4.45;
  const mLen = Math.hypot(moveX, moveZ);
  if (mLen > 0.05) {
    const nx = moveX / Math.max(1, mLen);
    const nz = moveZ / Math.max(1, mLen);
    const accel = hero.flinchTimer > 0 ? 0.35 : 1.0;
    hero.vx = lerp(hero.vx, nx * heroSpeed * accel, clamp(dt * 12, 0, 1));
    hero.vz = lerp(hero.vz, nz * heroSpeed * accel, clamp(dt * 12, 0, 1));
    if (aimYaw === null) aimYaw = Math.atan2(nx, nz);
  } else {
    hero.vx *= Math.pow(0.001, dt);
    hero.vz *= Math.pow(0.001, dt);
  }

  if (aimYaw !== null) {
    hero.yaw = lerpAngle(hero.yaw, aimYaw, clamp(dt * 14, 0, 1));
  }

  hero.x += hero.vx * dt;
  hero.z += hero.vz * dt;
  resolveWorldCollision(hero);

  // Hero timers & sword swing arc
  hero.attackCooldown = Math.max(0, hero.attackCooldown - dt);
  hero.flinchTimer = Math.max(0, hero.flinchTimer - dt);
  hero.invulnTimer = Math.max(0, hero.invulnTimer - dt);
  hero.healGlow = Math.max(0, hero.healGlow - dt);

  if (hero.attackAnim > 0) {
    hero.attackAnim += dt / 0.30;
    if (!hero.attackDidHit && hero.attackAnim >= 0.32) {
      hero.attackDidHit = true;
      performHeroSwordStrike();
    }
    if (hero.attackAnim >= 1) hero.attackAnim = 0;
  }

  // Animate Hero Figurine (Walk cycle, torch sway, sword swing, hit flinch)
  const spd = Math.hypot(hero.vx, hero.vz);
  if (spd > 0.35) {
    hero.walkPhase += dt * spd * 2.55;
    const curHalf = Math.floor(hero.walkPhase / Math.PI);
    if (curHalf !== hero.lastStepHalf) {
      hero.lastStepHalf = curHalf;
      sfx.footstep(0.11);
    }
  } else {
    hero.walkPhase = lerp(hero.walkPhase, Math.round(hero.walkPhase / Math.PI) * Math.PI, dt * 6);
  }

  const stride = Math.sin(hero.walkPhase) * clamp(spd / heroSpeed, 0, 1);
  const bob = Math.abs(Math.cos(hero.walkPhase)) * 0.085 * clamp(spd / heroSpeed, 0, 1);
  heroMesh.root.position.set(hero.x, 0, hero.z);
  heroMesh.root.rotation.y = hero.yaw;

  heroMesh.body.position.y = bob + Math.sin(elapsed * 2.6) * 0.015;
  heroMesh.body.rotation.x = (hero.flinchTimer > 0 ? -0.34 * (hero.flinchTimer / 0.28) : 0.07 * clamp(spd / heroSpeed, 0, 1));
  heroMesh.legL.rotation.x = stride * 0.68;
  heroMesh.legR.rotation.x = -stride * 0.68;
  heroMesh.cape.rotation.x = 0.14 + clamp(spd / heroSpeed, 0, 1) * 0.34 + Math.sin(elapsed * 5.2) * 0.05;

  // Torch arm sways organically with every step!
  heroMesh.armL.rotation.x = -0.14 + Math.sin(hero.walkPhase + 0.4) * 0.14 * clamp(spd / heroSpeed, 0, 1);
  heroMesh.armL.rotation.z = 0.08 + Math.cos(hero.walkPhase) * 0.09 * clamp(spd / heroSpeed, 0, 1);

  // Sword arm swing animation
  if (hero.attackAnim > 0) {
    const p = hero.attackAnim;
    let swingY = 0, swingX = 0;
    if (p < 0.24) {
      // Wind-up back
      const k = p / 0.24;
      swingY = lerp(0, -1.25, k);
      swingX = lerp(0, -0.55, k);
    } else if (p < 0.62) {
      // Crisp horizontal cleave across front!
      const k = (p - 0.24) / 0.38;
      swingY = lerp(-1.25, 1.45, k);
      swingX = lerp(-0.55, 0.45, k);
    } else {
      // Recover smoothly
      const k = (p - 0.62) / 0.38;
      swingY = lerp(1.45, 0, k);
      swingX = lerp(0.45, 0, k);
    }
    heroMesh.armR.rotation.y = swingY;
    heroMesh.armR.rotation.x = swingX;
  } else {
    heroMesh.armR.rotation.y = lerp(heroMesh.armR.rotation.y, 0, dt * 14);
    heroMesh.armR.rotation.x = -stride * 0.42;
  }

  // Hero hit-flash / heal-flash tint
  for (const m of heroMesh.flashMats) {
    if (hero.flinchTimer > 0) {
      m.emissive.setHex(0xb8241c);
      m.emissiveIntensity = (hero.flinchTimer / 0.28) * 1.4;
    } else if (hero.healGlow > 0) {
      m.emissive.setHex(0x36b85a);
      m.emissiveIntensity = hero.healGlow * 0.85;
    } else {
      m.emissiveIntensity = 0;
    }
  }

  // Update Hero Torch Flame & Primary Shadow-Casting Point Light!
  const f1 = Math.sin(elapsed * 11.4) * 0.08 + Math.sin(elapsed * 19.7 + 1.3) * 0.05 + Math.sin(elapsed * 33.1) * 0.03;
  const fScale = 1.0 + f1;
  heroMesh.flameOuter.scale.set(0.95 + f1 * 0.6, 1.0 + f1 * 1.5, 0.95 + f1 * 0.6);
  heroMesh.flameInner.scale.set(1.0 - f1 * 0.4, 1.0 + f1 * 1.2, 1.0 - f1 * 0.4);
  heroMesh.torchHalo.scale.set(1.55 * fScale, 1.55 * fScale, 1);

  heroMesh.root.updateMatrixWorld(true);
  const torchWorld = new THREE.Vector3();
  heroMesh.torchTip.getWorldPosition(torchWorld);
  heroTorchLight.position.set(
    torchWorld.x + Math.sin(elapsed * 17) * 0.03,
    torchWorld.y + 0.28 + Math.cos(elapsed * 21) * 0.025,
    torchWorld.z + Math.cos(elapsed * 15) * 0.03
  );
  heroTorchLight.intensity = 34.5 + f1 * 26.0;
  heroTorchLight.color.setHSL(0.072 + f1 * 0.045, 0.96, 0.57 + f1 * 0.06);

  // Spawn warm rising embers from hero's torch
  if (Math.random() < dt * 20) {
    spawnEmber(
      torchWorld.x + (Math.random() - 0.5) * 0.14,
      torchWorld.y + 0.1,
      torchWorld.z + (Math.random() - 0.5) * 0.14,
      (Math.random() - 0.5) * 0.45 - hero.vx * 0.12,
      1.1 + Math.random() * 1.25,
      (Math.random() - 0.5) * 0.45 - hero.vz * 0.12,
      0.55 + Math.random() * 0.65,
      false, 1.0, 0.52 + Math.random() * 0.35, 0.14
    );
  }

  // =========================================================================
  // DOORS, CHESTS, PICKUPS & STAIRS
  // =========================================================================
  for (const d of level.doors) {
    const dist = Math.hypot(hero.x - d.wx, hero.z - d.wz);
    if (!d.open && dist < 2.05) {
      if (d.locked) {
        if (level.hasKey) {
          d.locked = false;
          d.open = true;
          sfx.doorUnlock();
          if (d.lockMesh) {
            d.lockMesh.visible = false;
            for (let i = 0; i < 16; i++) {
              spawnEmber(d.wx, 1.0, d.wz, (Math.random() - 0.5) * 3.8, 1.5 + Math.random() * 2.5, (Math.random() - 0.5) * 3.8, 0.75, false, 1.0, 0.82, 0.32);
            }
          }
          showBanner('DOOR UNLOCKED', 'THE STAIRS DOWN AWAIT', 2100);
        }
      } else {
        d.open = true;
        sfx.doorOpen();
      }
    }
    if (d.open && d.angle < Math.PI * 0.48) {
      d.angle = Math.min(Math.PI * 0.48, d.angle + dt * 4.2);
      d.pivot.rotation.y = d.angle;
    }
  }

  // Chests open automatically when hero walks close
  for (const ch of level.chests) {
    if (!ch.opened && Math.hypot(hero.x - ch.wx, hero.z - ch.wz) < 1.65) {
      ch.opened = true;
      sfx.chest();
      const coins = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < coins; i++) {
        level.spawnPickup(ch.wx + (Math.random() - 0.5) * 1.1, ch.wz + (Math.random() - 0.5) * 1.1, 'gold', 5 + depth * 2);
      }
      if (ch.guaranteedPotion || hero.potions < 2 || Math.random() < 0.45) {
        level.spawnPickup(ch.wx + (Math.random() - 0.5) * 0.7, ch.wz + 0.55, 'potion', 1);
      }
      for (let i = 0; i < 14; i++) {
        spawnEmber(ch.wx, 0.65, ch.wz, (Math.random() - 0.5) * 2.6, 1.6 + Math.random() * 2.2, (Math.random() - 0.5) * 2.6, 0.7, false, 1.0, 0.85, 0.35);
      }
    }
    if (ch.opened && ch.openAnim < 1) {
      ch.openAnim = Math.min(1, ch.openAnim + dt * 4.5);
      ch.lidPivot.rotation.x = -ch.openAnim * 1.38;
    }
  }

  // Pickups (gold coins, potions, dungeon key)
  for (const p of level.pickups) {
    if (p.collected) continue;
    p.phase += dt * 3.2;
    if (p.vy !== 0 || p.y > 0.32) {
      p.vy -= 11 * dt;
      p.y += p.vy * dt;
      if (p.y <= 0.32) { p.y = 0.32; p.vy = 0; }
    }
    p.mesh.position.set(p.x, p.y + Math.sin(p.phase) * 0.08, p.z);
    p.mesh.rotation.y += dt * (p.type === 'key' ? 2.1 : 2.8);

    const d = Math.hypot(hero.x - p.x, hero.z - p.z);
    if (d < (p.type === 'key' ? 1.45 : 1.95)) {
      // Gentle magnetic pull so coins, potions & boss-dropped keys never catch on props
      p.x = lerp(p.x, hero.x, dt * 7.5);
      p.z = lerp(p.z, hero.z, dt * 7.5);
    }
    if (d < 1.02) {
      p.collected = true;
      p.mesh.visible = false;
      if (p.type === 'gold') {
        hero.gold += p.amount;
        sfx.coin();
      } else if (p.type === 'potion') {
        hero.potions = Math.min(5, hero.potions + 1);
        sfx.potion();
      } else if (p.type === 'key') {
        level.hasKey = true;
        sfx.keyPickup();
        showBanner('KEY ACQUIRED', 'SEEK THE LOCKED DOOR TO THE STAIRS', 2400);
        for (let i = 0; i < 20; i++) {
          const a = (i / 20) * Math.PI * 2;
          spawnEmber(p.x, 0.6, p.z, Math.cos(a) * 2.4, 2.2, Math.sin(a) * 2.4, 0.8, false, 1.0, 0.85, 0.28);
        }
      }
      updateHUD();
    }
  }

  // Stairs Down Check
  const stairX = (level.stairTile.gx + 0.5) * TILE;
  const stairZ = (level.stairTile.gy + 0.5) * TILE;
  if (Math.hypot(hero.x - stairX, hero.z - stairZ) < 1.05) {
    triggerDescend();
    return;
  }

  // =========================================================================
  // TRAPS (Spike Plates & Swinging Pendulum Axes)
  // =========================================================================
  for (const tr of level.traps) {
    tr.hitCooldown = Math.max(0, tr.hitCooldown - dt);
    if (tr.type === 'spike') {
      tr.timer = (tr.timer + dt) % 4.35;
      const wasActive = tr.active;
      tr.warn = tr.timer >= 2.6 && tr.timer < 3.25;
      tr.active = tr.timer >= 3.25;
      if (tr.active && !wasActive) {
        sfx.trapSnap(Math.hypot(hero.x - tr.wx, hero.z - tr.wz));
      }
      const targetY = tr.active ? 0.04 : (tr.warn ? -0.34 : -0.48);
      tr.spikes.position.y = lerp(tr.spikes.position.y, targetY, dt * 18);

      if (tr.active && tr.hitCooldown <= 0) {
        if (Math.hypot(hero.x - tr.wx, hero.z - tr.wz) < 0.72) {
          damageHero(1, tr.wx, tr.wz);
          tr.hitCooldown = 0.9;
        }
        for (const m of level.monsters) {
          if (!m.dead && Math.hypot(m.x - tr.wx, m.z - tr.wz) < 0.75) {
            m.hp -= 10; m.hitFlash = 0.2; tr.hitCooldown = 0.7;
            sfx.hitEnemy(m.type);
            if (m.hp <= 0) killMonster(m);
          }
        }
      }
    } else if (tr.type === 'blade') {
      const ang = Math.sin(elapsed * tr.speed + tr.phase) * 0.92;
      tr.pivot.rotation.z = ang;
      // Compute blade tip world offset along corridor cross-axis
      const swingOff = Math.sin(ang) * 2.1;
      const bx = tr.horiz ? tr.wx + swingOff : tr.wx;
      const bz = tr.horiz ? tr.wz : tr.wz + swingOff;
      if (Math.abs(ang) < 0.25 && tr.hitCooldown <= 0) {
        if (Math.hypot(hero.x - bx, hero.z - bz) < 0.66) {
          damageHero(1, bx, bz);
          tr.hitCooldown = 1.1;
        }
      }
    }
  }

  // =========================================================================
  // MONSTERS AI, ANIMATION, COMBAT & COLLISION SEPARATION
  // =========================================================================
  let activeBoss = null;
  for (const m of level.monsters) {
    if (m.dead) continue;
    m.hitFlash = Math.max(0, m.hitFlash - dt);
    m.attackCd = Math.max(0, m.attackCd - dt);

    const dx = hero.x - m.x;
    const dz = hero.z - m.z;
    const dist = Math.hypot(dx, dz);

    // Notice hero cleanly
    const noticeDist = m.type === 'boss' ? 12.0 : 8.5;
    if (!m.aggro && dist < noticeDist && hasLineOfSight(m.x, m.z, hero.x, hero.z)) {
      m.aggro = true;
    }
    if (m.type === 'boss' && (m.aggro || dist < 13.5)) {
      activeBoss = m;
    }

    let desVx = 0, desVz = 0;

    if (m.windup > 0) {
      // Telegraphed attack wind-up!
      m.windup -= dt;
      m.yaw = lerpAngle(m.yaw, Math.atan2(dx, dz), dt * 8);
      if (m.windup <= 0) {
        m.attackAnim = 0.001;
        m.attackCd = m.attackCdMax;
        if (m.type === 'boss') {
          spawnSlashArc(m.x + Math.sin(m.yaw) * 0.65, 0.9, m.z + Math.cos(m.yaw) * 0.65, m.yaw, 2.35, 0xff6e30, true);
          camShake.mag = Math.max(camShake.mag, 0.16);
        }
        if (dist <= m.attackRange + hero.radius + 0.35) {
          damageHero(m.dmg, m.x, m.z);
        }
      }
    } else if (m.aggro) {
      if (dist <= m.attackRange) {
        m.yaw = lerpAngle(m.yaw, Math.atan2(dx, dz), dt * 10);
        if (m.attackCd <= 0) {
          m.windup = m.type === 'boss' ? 0.52 : (m.type === 'rat' ? 0.24 : 0.36);
        }
      } else if (dist < 16) {
        const nx = dx / (dist || 1), nz = dz / (dist || 1);
        desVx = nx * m.speed;
        desVz = nz * m.speed;
        m.yaw = lerpAngle(m.yaw, Math.atan2(nx, nz), dt * 8);
      } else {
        m.aggro = false;
      }
    } else {
      // Lively idle room/corridor patrolling!
      m.patrolTimer -= dt;
      if (m.patrolTimer <= 0) {
        m.patrolTimer = 2.0 + Math.random() * 2.4;
        const a = Math.random() * Math.PI * 2;
        const rad = 1.2 + Math.random() * 2.2;
        const px = m.homeX + Math.cos(a) * rad;
        const pz = m.homeZ + Math.sin(a) * rad;
        if (isTileWalkable(Math.floor(px / TILE), Math.floor(pz / TILE), false)) {
          m.patrolX = px; m.patrolZ = pz;
        }
      }
      const pdx = m.patrolX - m.x, pdz = m.patrolZ - m.z;
      const pdist = Math.hypot(pdx, pdz);
      if (pdist > 0.35) {
        desVx = (pdx / pdist) * m.speed * 0.45;
        desVz = (pdz / pdist) * m.speed * 0.45;
        m.yaw = lerpAngle(m.yaw, Math.atan2(pdx, pdz), dt * 5);
      }
    }

    m.vx = lerp(m.vx, desVx, clamp(dt * 7.5, 0, 1));
    m.vz = lerp(m.vz, desVz, clamp(dt * 7.5, 0, 1));
    m.x += m.vx * dt;
    m.z += m.vz * dt;
    resolveWorldCollision(m);

    if (m.attackAnim > 0) {
      m.attackAnim += dt / 0.26;
      if (m.attackAnim >= 1) m.attackAnim = 0;
    }

    // Monster animations
    const mSpd = Math.hypot(m.vx, m.vz);
    m.walkPhase += dt * (mSpd * 3.1 + 1.8);
    const mo = m.meshObj;
    mo.root.position.set(m.x, 0, m.z);
    mo.root.rotation.y = m.yaw;

    if (m.type === 'skeleton' || m.type === 'boss') {
      const s = Math.sin(m.walkPhase) * clamp(mSpd / m.speed, 0, 1);
      mo.legL.rotation.x = s * 0.62;
      mo.legR.rotation.x = -s * 0.62;
      mo.body.position.y = Math.abs(Math.cos(m.walkPhase)) * 0.06 * clamp(mSpd / m.speed, 0, 1);
      if (m.windup > 0) {
        mo.armR.rotation.x = lerp(mo.armR.rotation.x, -1.65, dt * 12);
      } else if (m.attackAnim > 0) {
        mo.armR.rotation.x = lerp(-1.65, 1.15, m.attackAnim);
      } else {
        mo.armR.rotation.x = lerp(mo.armR.rotation.x, -s * 0.35, dt * 10);
      }
    } else if (m.type === 'rat') {
      const hop = Math.abs(Math.sin(m.walkPhase * 1.4)) * 0.09 * clamp(mSpd / m.speed, 0, 1);
      mo.body.position.y = hop + (m.attackAnim > 0 ? Math.sin(m.attackAnim * Math.PI) * 0.28 : 0);
      mo.body.position.z = m.attackAnim > 0 ? Math.sin(m.attackAnim * Math.PI) * 0.4 : (m.windup > 0 ? -0.18 : 0);
      if (mo.tail) mo.tail.rotation.y = Math.sin(elapsed * 11 + m.walkPhase) * 0.38;
    } else if (m.type === 'slime') {
      const sq = Math.sin(m.walkPhase * 0.85);
      const jump = Math.max(0, sq) * 0.26 * clamp(mSpd / m.speed + 0.3, 0, 1);
      mo.body.position.y = jump + (m.attackAnim > 0 ? Math.sin(m.attackAnim * Math.PI) * 0.36 : 0);
      const sx = 1.0 + (m.windup > 0 ? 0.28 : -sq * 0.14);
      const sy = 1.0 + (m.windup > 0 ? -0.26 : sq * 0.18);
      mo.body.scale.set(sx, sy, sx);
    }

    // Crisp hit-flash feedback
    for (const fm of mo.flashMats) {
      if (m.hitFlash > 0) {
        fm.emissive.setHex(0xffe0c4);
        fm.emissiveIntensity = (m.hitFlash / 0.22) * 2.2;
      } else if (m.windup > 0 && m.type === 'boss') {
        fm.emissive.setHex(0xb83612);
        fm.emissiveIntensity = 0.7;
      } else {
        fm.emissiveIntensity = m.type === 'slime' ? 0.45 : 0;
        if (m.type === 'slime') fm.emissive.setHex(0x102818);
      }
    }
  }

  // Boss health HUD bar
  if (activeBoss) {
    bossBarWrap.classList.add('visible');
    bossNameEl.textContent = `CRYPT WARDEN · DEPTH ${romanNumeral(depth)}`;
    bossBarFill.style.width = `${clamp((activeBoss.hp / activeBoss.maxHp) * 100, 0, 100)}%`;
  } else {
    bossBarWrap.classList.remove('visible');
  }

  // Pairwise Actor Separation (Hero vs Monsters & Monster vs Monster — zero pass-through!)
  const alive = level.monsters.filter((m) => !m.dead);
  for (let i = 0; i < alive.length; i++) {
    const a = alive[i];
    // Hero vs Monster
    const hdx = hero.x - a.x, hdz = hero.z - a.z;
    const hMin = hero.radius + a.radius;
    const hd2 = hdx * hdx + hdz * hdz;
    if (hd2 < hMin * hMin && hd2 > 0.00001) {
      const d = Math.sqrt(hd2);
      const push = (hMin - d) * 0.52;
      const nx = hdx / d, nz = hdz / d;
      hero.x += nx * push; hero.z += nz * push;
      a.x -= nx * push; a.z -= nz * push;
    }
    // Monster vs Monster
    for (let j = i + 1; j < alive.length; j++) {
      const b = alive[j];
      const dx = a.x - b.x, dz = a.z - b.z;
      const minD = a.radius + b.radius;
      const d2 = dx * dx + dz * dz;
      if (d2 < minD * minD && d2 > 0.00001) {
        const d = Math.sqrt(d2);
        const push = (minD - d) * 0.5;
        const nx = dx / d, nz = dz / d;
        a.x += nx * push; a.z += nz * push;
        b.x -= nx * push; b.z -= nz * push;
      }
    }
  }
  // Re-clamp to world boundaries after separation
  resolveWorldCollision(hero);
  for (const m of alive) {
    resolveWorldCollision(m);
    m.meshObj.root.position.set(m.x, 0, m.z);
  }
  heroMesh.root.position.set(hero.x, 0, hero.z);

  // =========================================================================
  // ENVIRONMENTAL ANIMATIONS, DYNAMIC LIGHT POOLING & PARTICLES
  // =========================================================================
  // Gently billow tattered banners
  for (const b of level.banners) {
    const sway = Math.sin(elapsed * 2.1 + b.phase) * 0.065;
    if (b.axis === 'x') b.mesh.rotation.x = sway;
    else b.mesh.rotation.z = sway;
  }

  // Animate all torches & braziers + emit rising embers
  for (const fl of level.flames) {
    const flick = Math.sin(elapsed * 12.2 + fl.phase) * 0.1 + Math.sin(elapsed * 21.5 + fl.phase * 1.7) * 0.06;
    fl.outer.scale.set(1 + flick * 0.5, 1 + flick * 1.5, 1 + flick * 0.5);
    fl.inner.scale.set(1 - flick * 0.3, 1 + flick * 1.2, 1 - flick * 0.3);
    fl.sprite.scale.set(1.35 * fl.scale * (1 + flick), 1.35 * fl.scale * (1 + flick), 1);
    fl.curIntensity = fl.baseIntensity * (1 + flick * 0.9);

    if (Math.hypot(fl.x - hero.x, fl.z - hero.z) < 16 && Math.random() < dt * 7.5) {
      spawnEmber(
        fl.x + (Math.random() - 0.5) * 0.18,
        fl.y + 0.06,
        fl.z + (Math.random() - 0.5) * 0.18,
        (Math.random() - 0.5) * 0.35,
        0.95 + Math.random() * 1.15,
        (Math.random() - 0.5) * 0.35,
        0.7 + Math.random() * 0.7,
        false, 1.0, 0.54 + Math.random() * 0.32, 0.14
      );
    }
  }

  // Bind pooled warm lights smoothly to the 6 closest wall torches / braziers to hero
  level.flames.sort((a, b) => Math.hypot(a.x - hero.x, a.z - hero.z) - Math.hypot(b.x - hero.x, b.z - hero.z));
  for (let i = 0; i < WARM_POOL_SIZE; i++) {
    const pl = warmLightPool[i];
    const fl = level.flames[i];
    if (fl) {
      const dist = Math.hypot(fl.x - hero.x, fl.z - hero.z);
      const fade = clamp(1 - (dist - 12) / 9, 0, 1);
      pl.position.set(fl.x, fl.y + 0.15, fl.z);
      pl.intensity = fl.curIntensity * fade;
    } else {
      pl.intensity = 0;
    }
  }

  // Cold accents (magic runes & moonlight grates)
  for (const ca of level.coldAccents) {
    if (ca.runeMesh) {
      ca.runeMesh.rotation.z = elapsed * 0.22 + ca.phase;
      ca.runeMesh.material.opacity = 0.68 + Math.sin(elapsed * 2.4 + ca.phase) * 0.2;
      if (Math.hypot(ca.x - hero.x, ca.z - hero.z) < 15 && Math.random() < dt * 5) {
        spawnEmber(
          ca.x + (Math.random() - 0.5) * 1.6, 0.1, ca.z + (Math.random() - 0.5) * 1.6,
          (Math.random() - 0.5) * 0.2, 0.75 + Math.random() * 0.75, (Math.random() - 0.5) * 0.2,
          1.1, true, 0.42, 0.82, 1.0
        );
      }
    }
  }
  level.coldAccents.sort((a, b) => Math.hypot(a.x - hero.x, a.z - hero.z) - Math.hypot(b.x - hero.x, b.z - hero.z));
  for (let i = 0; i < COLD_POOL_SIZE; i++) {
    const pl = coldLightPool[i];
    const ca = level.coldAccents[i];
    if (ca) {
      const dist = Math.hypot(ca.x - hero.x, ca.z - hero.z);
      const fade = clamp(1 - (dist - 11) / 8, 0, 1);
      const pulse = ca.isMoon ? 1.0 : (0.85 + Math.sin(elapsed * 2.6 + ca.phase) * 0.22);
      pl.position.set(ca.x, ca.y, ca.z);
      pl.color.setHex(ca.isMoon ? 0x7cb8f2 : 0x4ca6ff);
      pl.intensity = (ca.isMoon ? 12.5 : 14.5) * pulse * fade;
    } else {
      pl.intensity = 0;
    }
  }

  // Update rising ember particles
  for (let i = 0; i < MAX_EMBERS; i++) {
    const e = emberData[i];
    if (e.life > 0) {
      e.life -= dt;
      e.x += (e.vx + Math.sin(elapsed * 4.5 + i) * 0.25) * dt;
      e.y += e.vy * dt;
      e.z += (e.vz + Math.cos(elapsed * 4.1 + i) * 0.25) * dt;
      e.vy *= Math.pow(0.65, dt);
      const k = clamp(e.life / e.maxLife, 0, 1);
      emberPos[i * 3] = e.x;
      emberPos[i * 3 + 1] = e.y;
      emberPos[i * 3 + 2] = e.z;
      emberCol[i * 3] = e.r * k;
      emberCol[i * 3 + 1] = e.g * k * k;
      emberCol[i * 3 + 2] = e.b * k;
    } else {
      emberPos[i * 3 + 1] = -50;
    }
  }
  emberGeo.attributes.position.needsUpdate = true;
  emberGeo.attributes.color.needsUpdate = true;

  // Update drifting dust motes strictly illuminated inside the hero's torchlight & walkable space!
  for (let i = 0; i < MAX_DUST; i++) {
    const dm = dustMeta[i];
    const px = hero.x + dm.ox + Math.sin(elapsed * dm.speed + dm.phase) * 0.45;
    const py = dm.oy + Math.cos(elapsed * dm.speed * 0.7 + dm.phase) * 0.24;
    const pz = hero.z + dm.oz + Math.cos(elapsed * dm.speed * 0.9 + dm.phase) * 0.45;
    dustPos[i * 3]     = px;
    dustPos[i * 3 + 1] = py;
    dustPos[i * 3 + 2] = pz;

    const inRoom = isTileWalkable(Math.floor(px / TILE), Math.floor(pz / TILE), true);
    const distToTorch = Math.hypot(px - torchWorld.x, pz - torchWorld.z);
    const fade = inRoom ? clamp(1 - (distToTorch - 1.2) / 3.9, 0, 1) : 0;
    const shimmer = (0.55 + 0.45 * Math.sin(elapsed * 2.8 + dm.phase * 2.1)) * fade * fade;
    dustCol[i * 3]     = 1.0 * shimmer;
    dustCol[i * 3 + 1] = 0.76 * shimmer;
    dustCol[i * 3 + 2] = 0.45 * shimmer;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustGeo.attributes.color.needsUpdate = true;

  // Update combat debris (bouncing bones, skulls, slime goo blobs)
  for (let i = debrisList.length - 1; i >= 0; i--) {
    const d = debrisList[i];
    d.life -= dt;
    if (d.life <= 0) {
      fxGroup.remove(d.mesh);
      debrisList.splice(i, 1);
      continue;
    }
    d.vy -= 14.5 * dt;
    d.mesh.position.x += d.vx * dt;
    d.mesh.position.y += d.vy * dt;
    d.mesh.position.z += d.vz * dt;
    if (d.mesh.position.y < 0.08) {
      d.mesh.position.y = 0.08;
      d.vy = -d.vy * 0.34;
      d.vx *= 0.62;
      d.vz *= 0.62;
      d.rx *= 0.55; d.ry *= 0.55; d.rz *= 0.55;
    }
    d.mesh.rotation.x += d.rx * dt;
    d.mesh.rotation.y += d.ry * dt;
    d.mesh.rotation.z += d.rz * dt;
    if (d.life < 0.6) {
      d.mesh.scale.setScalar(d.baseScale * (d.life / 0.6));
    }
  }

  // Update sword slash arcs
  for (let i = slashArcs.length - 1; i >= 0; i--) {
    const sa = slashArcs[i];
    sa.age += dt;
    const p = sa.age / sa.dur;
    if (p >= 1) {
      fxGroup.remove(sa.mesh);
      sa.geo.dispose();
      sa.mat.dispose();
      slashArcs.splice(i, 1);
      continue;
    }
    sa.mesh.rotation.y += dt * 7.2 * sa.dir;
    sa.mesh.scale.setScalar(0.88 + p * 0.34);
    sa.mat.opacity = (1 - p) * 0.78;
  }

  // Update slime death goo splats
  for (let i = splats.length - 1; i >= 0; i--) {
    const sp = splats[i];
    sp.age += dt;
    if (sp.age >= sp.maxAge) {
      fxGroup.remove(sp.mesh);
      sp.mesh.material.dispose();
      splats.splice(i, 1);
      continue;
    }
    const grow = Math.min(1, sp.age * 7);
    sp.mesh.scale.setScalar(lerp(0.35, sp.targetScale, grow));
    if (sp.age > sp.maxAge - 2.0) {
      sp.mesh.material.opacity = 0.72 * ((sp.maxAge - sp.age) / 2.0);
    }
  }

  // Smooth Isometric Camera Follow + Micro Hit-Shake
  const lookAheadX = hero.vx * 0.24;
  const lookAheadZ = hero.vz * 0.24;
  camTarget.x = lerp(camTarget.x, hero.x + lookAheadX, clamp(dt * 4.8, 0, 1));
  camTarget.y = 0.85;
  camTarget.z = lerp(camTarget.z, hero.z + lookAheadZ, clamp(dt * 4.8, 0, 1));

  if (camShake.mag > 0.002) {
    camShake.x = (Math.random() - 0.5) * camShake.mag * 2;
    camShake.y = (Math.random() - 0.5) * camShake.mag * 2;
    camShake.mag *= Math.pow(0.0008, dt);
  } else {
    camShake.mag = 0; camShake.x = 0; camShake.y = 0;
  }

  camera.position.set(
    camTarget.x + CAM_OFFSET.x + camShake.x,
    camTarget.y + CAM_OFFSET.y + camShake.y,
    camTarget.z + CAM_OFFSET.z - camShake.x
  );
  camera.lookAt(camTarget.x + camShake.x * 0.4, camTarget.y, camTarget.z - camShake.x * 0.4);
}

/* ==========================================================================
   13. MAIN RENDER LOOP (Half-Res Nearest -> Tilt-Shift -> Subtle Bayer Dither)
   ========================================================================== */
const heroProjVec = new THREE.Vector3();
const camForwardVec = new THREE.Vector3();
const toHeroVec = new THREE.Vector3();

let prevTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, Math.max(0.001, (now - prevTime) / 1000));
  prevTime = now;

  updateSimulation(dt);

  // Project Hero's exact view-space depth & screen Y into Tilt-Shift focal plane!
  camera.updateMatrixWorld();
  camera.getWorldDirection(camForwardVec);
  toHeroVec.set(hero.x, 0.85, hero.z).sub(camera.position);
  const focusDist = toHeroVec.dot(camForwardVec);

  heroProjVec.set(hero.x, 0.85, hero.z).project(camera);
  const focusY = clamp(heroProjVec.y * 0.5 + 0.5, 0.25, 0.75);

  tiltShiftMat.uniforms.uFocusDist.value = focusDist;
  tiltShiftMat.uniforms.uFocusY.value = focusY;
  compositeMat.uniforms.uTime.value = elapsed;

  // Pass 0: Render 3D scene to reduced-resolution render target (with DepthTexture)
  renderer.setRenderTarget(sceneRT);
  renderer.clear();
  renderer.render(scene, camera);

  // Pass 1: Depth-aware Tilt-Shift Bokeh Lens Blur + Warm Fire Bloom
  renderer.setRenderTarget(blurRT);
  renderer.render(tiltScene, postCam);

  // Pass 2: Filmic Warm/Cool Grade + Subtle 8x8 Bayer Dither + Vignette + Film Grain -> Screen
  renderer.setRenderTarget(null);
  renderer.render(compositeScene, postCam);
}

// Kick off immediately — zero clicks or inputs required!
startLevel(1, true);
requestAnimationFrame(animate);
</script>
