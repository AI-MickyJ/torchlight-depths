<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TORCHLIGHT DEPTHS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080b12;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    color: #e4d8c4;
  }

  #game-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    outline: none;
  }

  /* Crisp pixel HUD */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .hud-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }

  .hud-left {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .hearts-row {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 7px 10px;
    background: rgba(10, 13, 20, 0.58);
    border: 1px solid rgba(255, 174, 92, 0.22);
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255, 206, 145, 0.08);
    border-radius: 2px;
  }

  .hearts-row.hurt {
    animation: hud-shake 0.26s ease-out;
    border-color: rgba(235, 76, 66, 0.72);
  }

  .hearts-row.healed {
    border-color: rgba(122, 224, 140, 0.65);
  }

  @keyframes hud-shake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-3px, 1px); }
    50% { transform: translate(3px, -1px); }
    75% { transform: translate(-2px, 0); }
  }

  .heart-svg {
    width: 18px;
    height: 16px;
    image-rendering: pixelated;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.85));
  }

  .inventory-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mini-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 9px;
    background: rgba(10, 13, 20, 0.54);
    border: 1px solid rgba(154, 176, 208, 0.18);
    border-radius: 2px;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: #d6cbb8;
    text-shadow: 1px 1px 0 #07090e;
  }

  .mini-badge.has-key {
    border-color: rgba(246, 188, 72, 0.65);
    color: #ffd36a;
    background: rgba(34, 24, 10, 0.65);
    box-shadow: 0 0 12px rgba(245, 168, 52, 0.28);
  }

  .mini-badge.no-key {
    opacity: 0.45;
  }

  .hud-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 7px;
  }

  .stats-panel {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 12px;
    background: rgba(10, 13, 20, 0.58);
    border: 1px solid rgba(255, 174, 92, 0.22);
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255, 206, 145, 0.08);
    border-radius: 2px;
    font-size: 9px;
    letter-spacing: 0.05em;
    text-shadow: 1px 1px 0 #07090e;
  }

  .stat-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .stat-label {
    color: #8b99ae;
    font-size: 8px;
  }

  .stat-val {
    color: #efe3cf;
  }

  .stat-val.gold {
    color: #f4be58;
  }

  .stat-val.depth {
    color: #ffae5c;
  }

  .stat-val.slain {
    color: #d78a7c;
  }

  .pixel-icon {
    width: 13px;
    height: 13px;
    image-rendering: pixelated;
    flex-shrink: 0;
  }

  /* Boss health bar */
  #boss-bar-wrap {
    position: fixed;
    top: 66px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 12;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.45s ease;
  }

  #boss-bar-wrap.visible {
    opacity: 1;
  }

  #boss-name {
    font-size: 9px;
    letter-spacing: 0.14em;
    color: #ffb878;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
  }

  .boss-bar-track {
    width: 240px;
    height: 10px;
    background: rgba(12, 14, 20, 0.82);
    border: 1px solid rgba(255, 138, 66, 0.55);
    padding: 2px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
  }

  #boss-bar-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #a62426, #df5c32);
    transition: width 0.14s ease-out;
  }

  /* Transient banner toast */
  #banner-toast {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 11;
    pointer-events: none;
    text-align: center;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #banner-toast.visible {
    opacity: 1;
  }

  #banner-title {
    font-size: 12px;
    letter-spacing: 0.16em;
    color: #f7c77a;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 2px 2px 0 #140c06;
  }

  #banner-sub {
    margin-top: 6px;
    font-size: 8px;
    letter-spacing: 0.12em;
    color: #9bb0ca;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
  }

  .hud-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
  }

  #mode-pill {
    font-size: 8px;
    letter-spacing: 0.08em;
    padding: 6px 9px;
    background: rgba(10, 13, 20, 0.42);
    border: 1px solid rgba(138, 158, 186, 0.16);
    border-radius: 2px;
    color: rgba(182, 196, 214, 0.52);
    text-shadow: 1px 1px 0 #07090e;
    transition: all 0.3s ease;
  }

  #mode-pill.manual {
    background: rgba(42, 26, 12, 0.72);
    border-color: rgba(255, 178, 88, 0.62);
    color: #ffd38c;
    box-shadow: 0 0 12px rgba(255, 152, 56, 0.25);
  }

  #sound-pill {
    pointer-events: auto;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: inherit;
    font-size: 8px;
    letter-spacing: 0.08em;
    padding: 7px 10px;
    background: rgba(12, 15, 22, 0.58);
    border: 1px solid rgba(255, 178, 96, 0.32);
    border-radius: 2px;
    color: #e4c694;
    text-shadow: 1px 1px 0 #07090e;
    transition: background 0.2s ease, border-color 0.2s ease, opacity 0.25s ease;
    opacity: 0.78;
  }

  #sound-pill:hover {
    opacity: 1;
    background: rgba(28, 22, 16, 0.78);
    border-color: rgba(255, 196, 112, 0.65);
  }

  #sound-pill.active {
    opacity: 0.48;
    border-color: rgba(154, 176, 208, 0.22);
    color: #b5c3d6;
  }

  #sound-pill.active:hover {
    opacity: 0.92;
  }

  #fade-veil {
    position: fixed;
    inset: 0;
    background: #07090f;
    pointer-events: none;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.42s ease;
  }

  #fade-veil.dark {
    opacity: 1;
  }

  @media (max-width: 680px) {
    #hud { padding: 10px 12px; }
    .stats-panel { gap: 9px; padding: 6px 8px; font-size: 7.5px; }
    .heart-svg { width: 14px; height: 13px; }
    #banner-title { font-size: 10px; }
  }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="hud">
  <div class="hud-top">
    <div class="hud-left">
      <div class="hearts-row" id="hearts-row"></div>
      <div class="inventory-row">
        <div class="mini-badge" id="potion-badge">
          <svg class="pixel-icon" viewBox="0 0 12 12" shape-rendering="crispEdges">
            <rect x="4" y="1" width="4" height="2" fill="#b89872"/>
            <rect x="5" y="3" width="2" height="1" fill="#8ca2ba"/>
            <rect x="3" y="4" width="6" height="2" fill="#9a242b"/>
            <rect x="2" y="6" width="8" height="4" fill="#c9363c"/>
            <rect x="3" y="10" width="6" height="1" fill="#811d24"/>
            <rect x="4" y="6" width="2" height="2" fill="#ff8e88"/>
          </svg>
          <span id="potion-count">x2</span>
        </div>
        <div class="mini-badge no-key" id="key-badge">
          <svg class="pixel-icon" viewBox="0 0 12 12" shape-rendering="crispEdges">
            <rect x="2" y="3" width="4" height="5" fill="#f0b844"/>
            <rect x="3" y="4" width="2" height="3" fill="#18120a"/>
            <rect x="6" y="5" width="5" height="2" fill="#f0b844"/>
            <rect x="8" y="7" width="1" height="2" fill="#d9972a"/>
            <rect x="10" y="7" width="1" height="3" fill="#d9972a"/>
          </svg>
          <span id="key-text">NO KEY</span>
        </div>
      </div>
    </div>

    <div class="hud-right">
      <div class="stats-panel">
        <div class="stat-item">
          <span class="stat-label">DEPTH</span>
          <span class="stat-val depth" id="stat-depth">1</span>
        </div>
        <div class="stat-item">
          <svg class="pixel-icon" viewBox="0 0 12 12" shape-rendering="crispEdges">
            <rect x="3" y="1" width="6" height="10" fill="#d4952b"/>
            <rect x="2" y="2" width="8" height="8" fill="#f3be4e"/>
            <rect x="4" y="3" width="4" height="6" fill="#ffd97a"/>
            <rect x="5" y="4" width="2" height="4" fill="#d4952b"/>
          </svg>
          <span class="stat-val gold" id="stat-gold">0</span>
        </div>
        <div class="stat-item">
          <svg class="pixel-icon" viewBox="0 0 12 12" shape-rendering="crispEdges">
            <rect x="3" y="1" width="6" height="2" fill="#d8cfc0"/>
            <rect x="2" y="3" width="8" height="5" fill="#e6dfd1"/>
            <rect x="3" y="4" width="2" height="2" fill="#1a1c24"/>
            <rect x="7" y="4" width="2" height="2" fill="#1a1c24"/>
            <rect x="5" y="6" width="2" height="1" fill="#3a332c"/>
            <rect x="3" y="8" width="6" height="2" fill="#bfb5a3"/>
            <rect x="4" y="9" width="1" height="2" fill="#1a1c24"/>
            <rect x="7" y="9" width="1" height="2" fill="#1a1c24"/>
          </svg>
          <span class="stat-val slain" id="stat-slain">0</span>
        </div>
      </div>
    </div>
  </div>

  <div class="hud-bottom">
    <div id="mode-pill">WASD / ARROWS · SPACE</div>
    <button id="sound-pill" type="button" aria-label="Toggle sound">
      <svg class="pixel-icon" id="sound-icon" viewBox="0 0 12 12" shape-rendering="crispEdges">
        <rect x="1" y="4" width="2" height="4" fill="currentColor"/>
        <rect x="3" y="3" width="2" height="6" fill="currentColor"/>
        <rect x="5" y="2" width="2" height="8" fill="currentColor"/>
        <rect x="8" y="4" width="1" height="4" fill="currentColor" opacity="0.5"/>
        <rect x="10" y="3" width="1" height="6" fill="currentColor" opacity="0.35"/>
      </svg>
      <span id="sound-label">click for sound</span>
    </button>
  </div>
</div>

<div id="banner-toast">
  <div id="banner-title">TORCHLIGHT DEPTHS</div>
  <div id="banner-sub">FLOOR I</div>
</div>

<div id="boss-bar-wrap">
  <div id="boss-name">CRYPT WARDEN</div>
  <div class="boss-bar-track"><div id="boss-bar-fill"></div></div>
</div>

<div id="fade-veil"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* ==========================================================================
   TORCHLIGHT DEPTHS — Self-Playing 3D Isometric Dungeon Explorer
   ========================================================================== */

const TILE = 2.0;
const GRID_W = 42;
const GRID_H = 42;

const T_VOID = 0;
const T_WALL = 1;
const T_FLOOR = 2;
const T_DOOR = 3;
const T_LOCKED = 4;
const T_STAIRS = 5;
const T_PILLAR = 6;
const T_CELL = 7;

// Deterministic PRNG helper for textures & procedural polish
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpAngle(a, b, t) {
  let d = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  return a + d * t;
}
function romanNumeral(n) {
  const vals = [1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const syms = ['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let out = '', num = Math.max(1, n);
  for (let i = 0; i < vals.length; i++) {
    while (num >= vals[i]) { out += syms[i]; num -= vals[i]; }
  }
  return out;
}

/* ==========================================================================
   1. WEB AUDIO SYNTHESIZED SOUND ENGINE
   ========================================================================== */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.noiseBuf = null;
    this.enabled = false;
    this.muted = false;
    this.crackleTimer = null;
    this.lastFootstep = 0;
    this.lastSwing = 0;
    this.lastTrapSound = 0;
  }

  unlock() {
    if (this.enabled) {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.ratio.value = 4;
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.62;
      this.master.connect(comp);
      comp.connect(this.ctx.destination);

      // Shared 2-second white noise buffer
      const sr = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, sr * 2, sr);
      const data = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

      this.enabled = true;
      this.startAmbience();
      this.updatePill();
    } catch (_) {
      // Silently ignore if audio unavailable
    }
  }

  toggleMute() {
    if (!this.enabled) {
      this.unlock();
      return;
    }
    this.muted = !this.muted;
    if (this.master && this.ctx) {
      this.master.gain.setTargetAtTime(this.muted ? 0.0 : 0.62, this.ctx.currentTime, 0.05);
    }
    this.updatePill();
  }

  updatePill() {
    const pill = document.getElementById('sound-pill');
    const label = document.getElementById('sound-label');
    if (!pill || !label) return;
    if (!this.enabled) {
      pill.classList.remove('active');
      label.textContent = 'click for sound';
    } else if (this.muted) {
      pill.classList.add('active');
      label.textContent = 'sound muted';
    } else {
      pill.classList.add('active');
      label.textContent = 'sound on';
    }
  }

  startAmbience() {
    const ctx = this.ctx;
    const now = ctx.currentTime;

    // 1. Low dungeon drone (deep stone cavern resonance)
    const droneGain = ctx.createGain();
    droneGain.gain.value = 0.085;
    const droneFilter = ctx.createBiquadFilter();
    droneFilter.type = 'lowpass';
    droneFilter.frequency.value = 155;
    droneFilter.Q.value = 2.4;

    const osc1 = ctx.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.value = 46.2;
    const osc2 = ctx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = 46.85;
    const osc3 = ctx.createOscillator();
    osc3.type = 'sine';
    osc3.frequency.value = 69.3;

    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.09;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 38;
    lfo.connect(lfoGain);
    lfoGain.connect(droneFilter.frequency);

    osc1.connect(droneFilter);
    osc2.connect(droneFilter);
    osc3.connect(droneFilter);
    droneFilter.connect(droneGain);
    droneGain.connect(this.master);

    osc1.start(now); osc2.start(now); osc3.start(now); lfo.start(now);

    // 2. Distant draft / cavernous air
    const draftSrc = ctx.createBufferSource();
    draftSrc.buffer = this.noiseBuf;
    draftSrc.loop = true;
    const draftBp = ctx.createBiquadFilter();
    draftBp.type = 'bandpass';
    draftBp.frequency.value = 250;
    draftBp.Q.value = 3.0;
    const draftGain = ctx.createGain();
    draftGain.gain.value = 0.028;
    draftSrc.connect(draftBp);
    draftBp.connect(draftGain);
    draftGain.connect(this.master);
    draftSrc.start(now);

    // 3. Torch warm fire bed
    const fireSrc = ctx.createBufferSource();
    fireSrc.buffer = this.noiseBuf;
    fireSrc.loop = true;
    const fireLp = ctx.createBiquadFilter();
    fireLp.type = 'lowpass';
    fireLp.frequency.value = 340;
    const fireHp = ctx.createBiquadFilter();
    fireHp.type = 'highpass';
    fireHp.frequency.value = 75;
    const fireGain = ctx.createGain();
    fireGain.gain.value = 0.042;
    fireSrc.connect(fireHp);
    fireHp.connect(fireLp);
    fireLp.connect(fireGain);
    fireGain.connect(this.master);
    fireSrc.start(now);

    // 4. Stochastic torch crackle snaps
    const scheduleCrackle = () => {
      if (!this.enabled) return;
      if (!this.muted && this.ctx.state === 'running') {
        const t = this.ctx.currentTime;
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuf;
        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 2100 + Math.random() * 3400;
        bp.Q.value = 2.6;
        const g = this.ctx.createGain();
        const peak = 0.018 + Math.random() * 0.042;
        const dur = 0.009 + Math.random() * 0.018;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(peak, t + 0.002);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(bp); bp.connect(g); g.connect(this.master);
        src.start(t, Math.random() * 1.6, dur + 0.01);
      }
      this.crackleTimer = setTimeout(scheduleCrackle, 85 + Math.random() * 240);
    };
    scheduleCrackle();
  }

  canPlay() {
    return this.enabled && !this.muted && this.ctx && this.ctx.state === 'running';
  }

  footstep(vol = 0.14) {
    if (!this.canPlay()) return;
    const t = this.ctx.currentTime;
    if (t - this.lastFootstep < 0.11) return;
    this.lastFootstep = t;

    // Crisp granite tap
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 900 + Math.random() * 550;
    bp.Q.value = 2.2;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.036);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t, Math.random() * 1.5, 0.05);

    // Subtle stone heel thud
    const osc = this.ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(145 + Math.random() * 35, t);
    osc.frequency.exponentialRampToValueAtTime(55, t + 0.04);
    const og = this.ctx.createGain();
    og.gain.setValueAtTime(vol * 0.45, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    osc.connect(og); og.connect(this.master);
    osc.start(t); osc.stop(t + 0.05);
  }

  swordSwing() {
    if (!this.canPlay()) return;
    const t = this.ctx.currentTime;
    if (t - this.lastSwing < 0.09) return;
    this.lastSwing = t;

    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(1750 + Math.random() * 250, t);
    bp.frequency.exponentialRampToValueAtTime(340, t + 0.13);
    bp.Q.value = 1.9;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.22, t + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t, Math.random() * 1.2, 0.16);

    // Faint steel edge shimmer
    const osc = this.ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(2200 + Math.random() * 350, t);
    osc.frequency.exponentialRampToValueAtTime(1100, t + 0.09);
    const og = this.ctx.createGain();
    og.gain.setValueAtTime(0.025, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.095);
    osc.connect(og); og.connect(this.master);
    osc.start(t); osc.stop(t + 0.1);
  }

  hitEnemy(type) {
    if (!this.canPlay()) return;
    const t = this.ctx.currentTime;

    // Punchy core thump
    const thump = this.ctx.createOscillator();
    thump.type = 'triangle';
    thump.frequency.setValueAtTime(type === 'boss' ? 125 : 185, t);
    thump.frequency.exponentialRampToValueAtTime(42, t + 0.11);
    const tg = this.ctx.createGain();
    tg.gain.setValueAtTime(type === 'boss' ? 0.34 : 0.26, t);
    tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    thump.connect(tg); tg.connect(this.master);
    thump.start(t); thump.stop(t + 0.13);

    if (type === 'skeleton' || type === 'boss') {
      // Dry bone / iron clack
      const osc = this.ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(type === 'boss' ? 540 : 1080 + Math.random() * 280, t);
      osc.frequency.exponentialRampToValueAtTime(240, t + 0.06);
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 1200; bp.Q.value = 3;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);
      osc.connect(bp); bp.connect(g); g.connect(this.master);
      osc.start(t); osc.stop(t + 0.08);
    } else if (type === 'rat') {
      // Sharp rat squeal
      const osc = this.ctx.createOscillator();
      osc.type = 'sawtooth';
      const base = 1450 + Math.random() * 420;
      osc.frequency.setValueAtTime(base, t);
      osc.frequency.linearRampToValueAtTime(base * 1.48, t + 0.04);
      osc.frequency.exponentialRampToValueAtTime(base * 0.65, t + 0.12);
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 2100; bp.Q.value = 3.2;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.12, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      osc.connect(bp); bp.connect(g); g.connect(this.master);
      osc.start(t); osc.stop(t + 0.14);
    } else if (type === 'slime') {
      // Wet squelch
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      const lp = this.ctx.createBiquadFilter();
      lp.type = 'bandpass'; lp.Q.value = 7.5;
      lp.frequency.setValueAtTime(320, t);
      lp.frequency.exponentialRampToValueAtTime(1180, t + 0.05);
      lp.frequency.exponentialRampToValueAtTime(240, t + 0.14);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.24, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      src.connect(lp); lp.connect(g); g.connect(this.master);
      src.start(t, Math.random() * 1.4, 0.16);
    }
  }

  enemyDie(type) {
    if (!this.canPlay()) return;
    const t = this.ctx.currentTime;
    if (type === 'skeleton' || type === 'boss') {
      const count = type === 'boss' ? 8 : 5;
      for (let i = 0; i < count; i++) {
        const dt = i * 0.042 + Math.random() * 0.025;
        const osc = this.ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(750 + Math.random() * 750, t + dt);
        osc.frequency.exponentialRampToValueAtTime(210, t + dt + 0.045);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.14 * (1 - i / (count + 2)), t + dt);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.055);
        osc.connect(g); g.connect(this.master);
        osc.start(t + dt); osc.stop(t + dt + 0.06);
      }
      if (type === 'boss') {
        // Deep dramatic rumble collapse
        const sub = this.ctx.createOscillator();
        sub.type = 'sawtooth';
        sub.frequency.setValueAtTime(110, t);
        sub.frequency.exponentialRampToValueAtTime(32, t + 0.55);
        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 260;
        const sg = this.ctx.createGain();
        sg.gain.setValueAtTime(0.32, t);
        sg.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
        sub.connect(lp); lp.connect(sg); sg.connect(this.master);
        sub.start(t); sub.stop(t + 0.62);
      }
    } else if (type === 'rat') {
      const osc = this.ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1950, t);
      osc.frequency.exponentialRampToValueAtTime(520, t + 0.19);
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 1600; bp.Q.value = 3;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.11, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.21);
      osc.connect(bp); bp.connect(g); g.connect(this.master);
      osc.start(t); osc.stop(t + 0.22);
    } else if (type === 'slime') {
      for (let i = 0; i < 3; i++) {
        const dt = i * 0.05;
        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220 + i * 90, t + dt);
        osc.frequency.exponentialRampToValueAtTime(640 + i * 160, t + dt + 0.06);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.14, t + dt);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.07);
        osc.connect(g); g.connect(this.master);
        osc.start(t + dt); osc.stop(t + dt + 0.08);
      }
    }
  }

  heroHit() {
    if (!this.canPlay()) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(48, t + 0.16);
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 460;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
    osc.connect(lp); lp.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.18);
  }

  coin() {
    if (!this.canPlay()) return;
    const t = this.ctx.currentTime;
    [2093, 2793].forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f + (Math.random() - 0.5) * 60, t + i * 0.05);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.11, t + i * 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.05 + 0.15);
      osc.connect(g); g.connect(this.master);
      osc.start(t + i * 0.05); osc.stop(t + i * 0.05 + 0.16);
    });
  }

  potion() {
    if (!this.canPlay()) return;
    const t = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, t + i * 0.055);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.11, t + i * 0.055);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.055 + 0.24);
      osc.connect(g); g.connect(this.master);
      osc.start(t + i * 0.055); osc.stop(t + i * 0.055 + 0.25);
    });
  }

  chest() {
    if (!this.canPlay()) return;
    const t = this.ctx.currentTime;
    // Wooden hinge creak
    const osc = this.ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, t);
    osc.frequency.linearRampToValueAtTime(245, t + 0.16);
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 4;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
    osc.connect(bp); bp.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.2);
    setTimeout(() => this.coin(), 90);
  }

  keyPickup() {
    if (!this.canPlay()) return;
    const t = this.ctx.currentTime;
    [880, 1174.66, 1567.98, 2093].forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, t + i * 0.06);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.13, t + i * 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.06 + 0.32);
      osc.connect(g); g.connect(this.master);
      osc.start(t + i * 0.06); osc.stop(t + i * 0.06 + 0.34);
    });
  }

  doorOpen() {
    if (!this.canPlay()) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(128, t);
    osc.frequency.linearRampToValueAtTime(192, t + 0.18);
    osc.frequency.linearRampToValueAtTime(145, t + 0.28);
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 390; bp.Q.value = 4.5;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.09, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    osc.connect(bp); bp.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + 0.31);
  }

  doorUnlock() {
    if (!this.canPlay()) return;
    const t = this.ctx.currentTime;
    // Heavy iron tumbler clack-clack
    [0, 0.095].forEach((dt, idx) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(idx === 0 ? 780 : 1120, t + dt);
      osc.frequency.exponentialRampToValueAtTime(220, t + dt + 0.06);
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 1350; bp.Q.value = 2.5;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.22, t + dt);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.08);
      osc.connect(bp); bp.connect(g); g.connect(this.master);
      osc.start(t + dt); osc.stop(t + dt + 0.09);
    });
    // Resonant brass chord
    [440, 659.25, 880].forEach((f) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, t + 0.16);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.08, t + 0.16);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
      osc.connect(g); g.connect(this.master);
      osc.start(t + 0.16); osc.stop(t + 0.67);
    });
  }

  trapSnap(dist) {
    if (!this.canPlay() || dist > 11) return;
    const t = this.ctx.currentTime;
    if (t - this.lastTrapSound < 0.25) return;
    this.lastTrapSound = t;
    const vol = clamp(1 - dist / 11, 0, 1) * 0.14;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const hp = this.ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 1800;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    src.connect(hp); hp.connect(g); g.connect(this.master);
    src.start(t, Math.random() * 1.3, 0.08);
  }

  stairsDescend() {
    if (!this.canPlay()) return;
    const t = this.ctx.currentTime;
    for (let i = 0; i < 4; i++) {
      setTimeout(() => this.footstep(0.14 - i * 0.02), i * 115);
    }
    [220, 196, 164.81, 130.81].forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, t + i * 0.12);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.09, t + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.12 + 0.45);
      osc.connect(g); g.connect(this.master);
      osc.start(t + i * 0.12); osc.stop(t + i * 0.12 + 0.47);
    });
  }
}

const sfx = new SoundEngine();

/* ==========================================================================
   2. PROCEDURAL CANVAS TEXTURES (Gritty Matte Stone, Wood, Runes, Webs)
   ========================================================================== */
function createProceduralTextures() {
  const rand = mulberry32(48271);

  // --- 1. Rough Stone Masonry Wall (Diffuse + Bump) ---
  function makeStoneWall() {
    const size = 256;
    const c = document.createElement('canvas'); c.width = c.height = size;
    const ctx = c.getContext('2d');
    const bc = document.createElement('canvas'); bc.width = bc.height = size;
    const bctx = bc.getContext('2d');

    // Deep dark mortar background
    ctx.fillStyle = '#181c24';
    ctx.fillRect(0, 0, size, size);
    bctx.fillStyle = '#141414';
    bctx.fillRect(0, 0, size, size);

    const rows = 6;
    const rowH = size / rows;
    for (let r = 0; r < rows; r++) {
      const y = r * rowH;
      const cols = 3 + (r % 2);
      let x = (r % 2) * -(size / cols) * 0.48;
      while (x < size) {
        const w = (size / cols) * (0.82 + rand() * 0.36);
        const pad = 2.5;
        const shade = 54 + Math.floor(rand() * 34);
        const cool = Math.floor(rand() * 14);
        const warm = Math.floor(rand() * 7);
        const R = shade + warm;
        const G = shade + Math.floor(cool * 0.45);
        const B = shade + cool + 7;

        // Stone block body
        ctx.fillStyle = `rgb(${R},${G},${B})`;
        ctx.fillRect(x + pad, y + pad, w - pad * 2, rowH - pad * 2);

        // Chipped top highlight & bottom bevel
        ctx.fillStyle = `rgba(180,192,210,0.14)`;
        ctx.fillRect(x + pad, y + pad, w - pad * 2, 3);
        ctx.fillStyle = `rgba(10,12,18,0.34)`;
        ctx.fillRect(x + pad, y + rowH - pad - 4, w - pad * 2, 4);

        // Bump block height
        const bh = 155 + Math.floor(rand() * 65);
        bctx.fillStyle = `rgb(${bh},${bh},${bh})`;
        bctx.fillRect(x + pad + 1, y + pad + 1, w - pad * 2 - 2, rowH - pad * 2 - 2);

        // Surface cracks & pits
        if (rand() < 0.48) {
          ctx.strokeStyle = 'rgba(14,16,22,0.52)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          const sx = x + pad + 6 + rand() * Math.max(4, w - 18);
          const sy = y + pad + 4 + rand() * (rowH - 12);
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx + (rand() - 0.5) * 18, sy + (rand() - 0.5) * 14);
          ctx.stroke();
        }
        x += w;
      }
    }

    // Fine stone grain & grime
    for (let i = 0; i < 4200; i++) {
      const gx = rand() * size;
      const gy = rand() * size;
      const dark = rand() > 0.42;
      ctx.fillStyle = dark ? 'rgba(12,14,20,0.18)' : 'rgba(165,175,190,0.09)';
      ctx.fillRect(gx, gy, 2, 2);
      bctx.fillStyle = dark ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.14)';
      bctx.fillRect(gx, gy, 2, 2);
    }

    // Damp moss & soot gradient near base of wall
    const grd = ctx.createLinearGradient(0, size * 0.62, 0, size);
    grd.addColorStop(0, 'rgba(14,20,16,0)');
    grd.addColorStop(1, 'rgba(18,26,20,0.48)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, size * 0.62, size, size * 0.38);

    const map = new THREE.CanvasTexture(c);
    map.colorSpace = THREE.SRGBColorSpace;
    map.wrapS = map.wrapT = THREE.RepeatWrapping;
    map.magFilter = THREE.NearestFilter;
    map.minFilter = THREE.LinearMipmapLinearFilter;

    const bump = new THREE.CanvasTexture(bc);
    bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
    return { map, bump };
  }

  // --- 2. Flagstone Floor (Diffuse + Bump with Cracks & Moss) ---
  function makeFlagstone() {
    const size = 256;
    const c = document.createElement('canvas'); c.width = c.height = size;
    const ctx = c.getContext('2d');
    const bc = document.createElement('canvas'); bc.width = bc.height = size;
    const bctx = bc.getContext('2d');

    ctx.fillStyle = '#141820';
    ctx.fillRect(0, 0, size, size);
    bctx.fillStyle = '#181818';
    bctx.fillRect(0, 0, size, size);

    // 4x4 irregular flagstone slabs
    const slabs = [
      [0,0,124,116], [128,0,128,92],
      [0,120,88,136], [92,96,92,82], [188,96,68,160],
      [92,182,92,74]
    ];
    for (const [x, y, w, h] of slabs) {
      const base = 52 + Math.floor(rand() * 26);
      const cool = 6 + Math.floor(rand() * 12);
      ctx.fillStyle = `rgb(${base + 4},${base + Math.floor(cool * 0.5)},${base + cool})`;
      ctx.fillRect(x + 3, y + 3, w - 6, h - 6);

      // Subtle bevel edge
      ctx.strokeStyle = 'rgba(170,182,198,0.12)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 4, y + 4, w - 8, h - 8);

      const bh = 160 + Math.floor(rand() * 55);
      bctx.fillStyle = `rgb(${bh},${bh},${bh})`;
      bctx.fillRect(x + 4, y + 4, w - 8, h - 8);

      // Diagonal crack inside slab
      if (rand() < 0.72) {
        ctx.strokeStyle = 'rgba(14,17,24,0.62)';
        ctx.lineWidth = 1.5;
        bctx.strokeStyle = '#202020';
        bctx.lineWidth = 2;
        const cx1 = x + 12 + rand() * (w - 24);
        const cy1 = y + 12 + rand() * (h - 24);
        const cx2 = cx1 + (rand() - 0.5) * 38;
        const cy2 = cy1 + (rand() - 0.5) * 38;
        ctx.beginPath(); ctx.moveTo(cx1, cy1); ctx.lineTo(cx2, cy2); ctx.stroke();
        bctx.beginPath(); bctx.moveTo(cx1, cy1); bctx.lineTo(cx2, cy2); bctx.stroke();
      }
    }

    // Subtle moss flecks tucked near mortar seams
    for (let i = 0; i < 28; i++) {
      const mx = rand() * size;
      const my = rand() * size;
      if (rand() < 0.55) {
        ctx.fillStyle = `rgba(${42 + Math.floor(rand() * 20)}, ${64 + Math.floor(rand() * 22)}, ${38 + Math.floor(rand() * 14)}, 0.34)`;
        ctx.beginPath();
        ctx.arc(mx, my, 3 + rand() * 7, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Fine matte stone grit
    for (let i = 0; i < 4800; i++) {
      const gx = rand() * size, gy = rand() * size;
      ctx.fillStyle = rand() > 0.45 ? 'rgba(10,12,18,0.16)' : 'rgba(165,172,185,0.08)';
      ctx.fillRect(gx, gy, 2, 2);
      bctx.fillStyle = rand() > 0.5 ? 'rgba(0,0,0,0.16)' : 'rgba(255,255,255,0.12)';
      bctx.fillRect(gx, gy, 2, 2);
    }

    const map = new THREE.CanvasTexture(c);
    map.colorSpace = THREE.SRGBColorSpace;
    map.wrapS = map.wrapT = THREE.RepeatWrapping;
    map.magFilter = THREE.NearestFilter;
    map.minFilter = THREE.LinearMipmapLinearFilter;

    const bump = new THREE.CanvasTexture(bc);
    bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
    return { map, bump };
  }

  // --- 3. Weathered Iron-Bound Wood ---
  function makeWood() {
    const size = 128;
    const c = document.createElement('canvas'); c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#473322';
    ctx.fillRect(0, 0, size, size);

    for (let p = 0; p < 4; p++) {
      const x = p * 32;
      const shade = 56 + Math.floor(rand() * 24);
      ctx.fillStyle = `rgb(${shade + 18},${shade},${Math.floor(shade * 0.65)})`;
      ctx.fillRect(x + 1, 0, 30, size);
      // Grain lines
      for (let g = 0; g < 16; g++) {
        ctx.fillStyle = rand() > 0.5 ? 'rgba(24,14,8,0.22)' : 'rgba(130,96,64,0.12)';
        ctx.fillRect(x + 2 + rand() * 26, 0, 1.4, size);
      }
      ctx.fillStyle = '#1e140c';
      ctx.fillRect(x, 0, 2, size);
    }
    // Iron horizontal bands
    [22, 96].forEach((by) => {
      ctx.fillStyle = '#252930';
      ctx.fillRect(0, by, size, 12);
      ctx.fillStyle = '#484f5c';
      ctx.fillRect(0, by + 1, size, 2);
      for (let rx = 10; rx < size; rx += 22) {
        ctx.fillStyle = '#626b78';
        ctx.fillRect(rx, by + 4, 4, 4);
      }
    });
    const map = new THREE.CanvasTexture(c);
    map.colorSpace = THREE.SRGBColorSpace;
    map.magFilter = THREE.NearestFilter;
    return map;
  }

  // --- 4. Glowing Cold Magic Rune Circle ---
  function makeRune() {
    const s = 256;
    const c = document.createElement('canvas'); c.width = c.height = s;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, s, s);
    const cx = s / 2, cy = s / 2;

    const grad = ctx.createRadialGradient(cx, cy, 8, cx, cy, 118);
    grad.addColorStop(0, 'rgba(92, 188, 255, 0.35)');
    grad.addColorStop(0.65, 'rgba(54, 138, 224, 0.14)');
    grad.addColorStop(1, 'rgba(30, 80, 160, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, s, s);

    ctx.strokeStyle = 'rgba(140, 218, 255, 0.92)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, cy, 102, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy, 80, 0, Math.PI * 2); ctx.stroke();

    // Inner arcane star
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a1 = (i / 6) * Math.PI * 2;
      const a2 = ((i + 2) / 6) * Math.PI * 2;
      ctx.moveTo(cx + Math.cos(a1) * 78, cy + Math.sin(a1) * 78);
      ctx.lineTo(cx + Math.cos(a2) * 78, cy + Math.sin(a2) * 78);
    }
    ctx.stroke();

    // Runic ticks
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const r1 = 84, r2 = 98;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.lineTo(cx + Math.cos(a + 0.08) * r2, cy + Math.sin(a + 0.08) * r2);
      ctx.stroke();
    }

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  // --- 5. Cobweb ---
  function makeCobweb() {
    const s = 128;
    const c = document.createElement('canvas'); c.width = c.height = s;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, s, s);
    ctx.strokeStyle = 'rgba(195, 200, 210, 0.42)';
    ctx.lineWidth = 1.4;
    const spokes = 7;
    for (let i = 0; i < spokes; i++) {
      const a = (i / (spokes - 1)) * (Math.PI * 0.5);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s);
      ctx.stroke();
    }
    for (let ring = 1; ring <= 5; ring++) {
      const rad = ring * 21;
      ctx.beginPath();
      for (let i = 0; i < spokes; i++) {
        const a = (i / (spokes - 1)) * (Math.PI * 0.5);
        const px = Math.cos(a) * rad;
        const py = Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(px, py);
        else {
          const prevA = ((i - 1) / (spokes - 1)) * (Math.PI * 0.5);
          const midA = (a + prevA) * 0.5;
          ctx.quadraticCurveTo(Math.cos(midA) * (rad * 0.86), Math.sin(midA) * (rad * 0.86), px, py);
        }
      }
      ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  // --- 6. Tattered Dungeon Banner ---
  function makeBanner(crimson) {
    const w = 96, h = 192;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, w, h);

    ctx.fillStyle = crimson ? '#562124' : '#4a4332';
    ctx.beginPath();
    ctx.moveTo(6, 0); ctx.lineTo(w - 6, 0);
    ctx.lineTo(w - 8, h - 34);
    ctx.lineTo(w * 0.72, h - 8);
    ctx.lineTo(w * 0.52, h - 38);
    ctx.lineTo(w * 0.30, h - 10);
    ctx.lineTo(10, h - 42);
    ctx.closePath();
    ctx.fill();

    // Trim & faded emblem
    ctx.strokeStyle = crimson ? '#8f7245' : '#7b828c';
    ctx.lineWidth = 4;
    ctx.strokeRect(14, 10, w - 28, h - 64);

    // Simple heraldic diamond/sword motif
    ctx.fillStyle = 'rgba(205, 190, 158, 0.34)';
    ctx.fillRect(w / 2 - 3, 34, 6, 72);
    ctx.fillRect(w / 2 - 18, 56, 36, 6);

    // Cloth weave grit
    for (let i = 0; i < 650; i++) {
      ctx.fillStyle = rand() > 0.5 ? 'rgba(0,0,0,0.16)' : 'rgba(255,240,210,0.06)';
      ctx.fillRect(8 + rand() * (w - 16), rand() * (h - 28), 2, 2);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.magFilter = THREE.NearestFilter;
    return tex;
  }

  // --- 7. Moonlight Grate Floor Patch ---
  function makeGrateLight() {
    const s = 128;
    const c = document.createElement('canvas'); c.width = c.height = s;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, s, s);
    const grad = ctx.createRadialGradient(s / 2, s / 2, 8, s / 2, s / 2, 60);
    grad.addColorStop(0, 'rgba(150, 205, 255, 0.55)');
    grad.addColorStop(0.7, 'rgba(105, 162, 230, 0.25)');
    grad.addColorStop(1, 'rgba(70, 120, 195, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, s, s);

    // Crisp dark iron grate bars cut out
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.88)';
    for (let x = 24; x <= 104; x += 26) ctx.fillRect(x, 0, 7, s);
    for (let y = 24; y <= 104; y += 26) ctx.fillRect(0, y, s, 7);
    ctx.globalCompositeOperation = 'source-over';

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  // --- 8. Soft Radial Glow Sprite ---
  function makeGlowSprite() {
    const s = 96;
    const c = document.createElement('canvas'); c.width = c.height = s;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(s / 2, s / 2, 2, s / 2, s / 2, s / 2);
    g.addColorStop(0, 'rgba(255, 236, 175, 1.0)');
    g.addColorStop(0.28, 'rgba(255, 152, 54, 0.62)');
    g.addColorStop(0.65, 'rgba(210, 82, 18, 0.16)');
    g.addColorStop(1, 'rgba(160, 40, 0, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  return {
    stoneWall: makeStoneWall(),
    flagstone: makeFlagstone(),
    wood: makeWood(),
    rune: makeRune(),
    cobweb: makeCobweb(),
    bannerRed: makeBanner(true),
    bannerOchre: makeBanner(false),
    grateLight: makeGrateLight(),
    glow: makeGlowSprite(),
  };
}

const postVert = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

// Pass 1: Depth-Aware Real Tilt-Shift Bokeh Lens Blur + Subtle Fire Bloom
const tiltShiftFrag = /* glsl */`
  precision highp float;
  uniform sampler2D tColor;
  uniform sampler2D tDepth;
  uniform vec2 uTexelSize;
  uniform float uNear;
  uniform float uFar;
  uniform float uFocusDist;
  uniform float uFocusY;
  varying vec2 vUv;

  float linearizeDepth(float d) {
    float z = d * 2.0 - 1.0;
    return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
  }

  float computeCoC(float rawDepth, vec2 uv) {
    float yDist = abs(uv.y - uFocusY);
    float yCoC = smoothstep(0.115, 0.44, yDist);
    if (rawDepth >= 0.9997) {
      return pow(yCoC, 1.1);
    }
    float linD = linearizeDepth(rawDepth);
    float dDiff = abs(linD - uFocusDist);
    // Razor-sharp band right around hero depth plane, strong optical ramp above/below
    float dCoC = smoothstep(2.05, 7.6, dDiff);
    float combined = clamp(mix(dCoC, yCoC, 0.42), 0.0, 1.0);
    return pow(combined, 1.12);
  }

  void main() {
    vec4 centerCol = texture2D(tColor, vUv);
    float centerRaw = texture2D(tDepth, vUv).r;
    float centerLin = linearizeDepth(centerRaw);
    float coc = computeCoC(centerRaw, vUv);

    vec3 outCol = centerCol.rgb;

    if (coc > 0.015) {
      // 20-tap Vogel Golden-Angle Disk Bokeh for miniature tilt-shift lens feel
      float maxRadius = 5.4; // strong optical blur toward top/bottom, razor-sharp center band
      float radius = coc * maxRadius;
      vec3 accum = centerCol.rgb;
      float totalW = 1.0;
      const float GOLDEN = 2.39996323;

      for (int i = 1; i <= 20; i++) {
        float fi = float(i);
        float r = sqrt(fi / 20.0) * radius;
        float theta = fi * GOLDEN;
        vec2 offset = vec2(cos(theta), sin(theta)) * r * uTexelSize;
        vec2 suv = clamp(vUv + offset, vec2(0.001), vec2(0.999));

        vec3 scol = texture2D(tColor, suv).rgb;
        float sraw = texture2D(tDepth, suv).r;
        float slin = linearizeDepth(sraw);
        float scoc = computeCoC(sraw, suv);

        // Protect sharp focal plane from bleeding oddly into far out-of-focus background
        float bleedGuard = (slin < centerLin - 0.65 && scoc < 0.08 && centerLin > uFocusDist + 1.8) ? 0.20 : 1.0;
        // Gentle highlight energy boost -> out-of-focus flames bloom softly without harsh blobs
        float lum = dot(scol, vec3(0.299, 0.587, 0.114));
        float bokehBoost = 1.0 + clamp((lum - 0.9) * 0.55, 0.0, 0.85);

        float w = bleedGuard * bokehBoost;
        accum += scol * w;
        totalW += w;
      }
      outCol = accum / totalW;
    }

    // Subtle tight warm-emissive bloom on flames, embers & glowing runes
    vec3 bloom = vec3(0.0);
    for (int i = 0; i < 8; i++) {
      float a = float(i) * 0.78539816;
      vec2 off1 = vec2(cos(a), sin(a)) * 2.1 * uTexelSize;
      vec2 off2 = vec2(cos(a + 0.39), sin(a + 0.39)) * 4.2 * uTexelSize;
      vec3 c1 = texture2D(tColor, clamp(vUv + off1, 0.001, 0.999)).rgb;
      vec3 c2 = texture2D(tColor, clamp(vUv + off2, 0.001, 0.999)).rgb;
      bloom += max(vec3(0.0), c1 - vec3(0.92)) * 0.065;
      bloom += max(vec3(0.0), c2 - vec3(1.05)) * 0.032;
    }

    gl_FragColor = vec4(outCol + bloom, 1.0);
  }
`;

// Pass 2: Filmic Warm/Cool Color Grade + Subtle 8x8 Bayer Ordered Dither + Vignette + Film Grain
const compositeFrag = /* glsl */`
  precision highp float;
  uniform sampler2D tDiffuse;
  uniform vec2 uLowRes;
  uniform float uTime;
  varying vec2 vUv;

  // Exact recursive 8x8 Bayer matrix without bitwise ops
  float bayer2(vec2 a) {
    vec2 b = mod(floor(a), 2.0);
    return fract(b.x * 0.5 + b.y * 0.75);
  }
  float bayer4(vec2 a) {
    return bayer2(0.5 * a) * 0.25 + bayer2(a);
  }
  float bayer8(vec2 a) {
    return bayer4(0.5 * a) * 0.25 + bayer2(a);
  }

  // ACES-inspired matte filmic curve (rich warm highlights, never glossy plastic)
  vec3 filmicToneMap(vec3 x) {
    const float a = 2.51;
    const float b = 0.03;
    const float c = 2.43;
    const float d = 0.59;
    const float e = 0.14;
    return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
  }

  float hash12(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
  }

  void main() {
    // Snap UVs onto low-res pixel centers so NearestFilter chunky texture stays crisp
    vec2 lowPx = floor(vUv * uLowRes);
    vec2 snappedUv = (lowPx + 0.5) / uLowRes;
    vec3 col = texture2D(tDiffuse, snappedUv).rgb;

    // Gentle exposure & dungeon warm/cold split tone in linear space
    col *= 1.24;
    col = filmicToneMap(col);

    // Preserve cold desaturated blue-grey shadows & warm amber torchlit mid/highlights
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    vec3 coldShadowTint = vec3(0.80, 0.91, 1.15);
    vec3 warmLightTint  = vec3(1.08, 0.99, 0.88);
    col *= mix(coldShadowTint, warmLightTint, smoothstep(0.08, 0.54, lum));

    // Mild desaturation in deep shadow so stone stays gritty & moody
    float shadowDesat = (1.0 - smoothstep(0.06, 0.34, lum)) * 0.28;
    col = mix(col, vec3(lum) * vec3(0.82, 0.92, 1.10), shadowDesat);

    // Deep slate-indigo floor (clean void while ambient lights illuminate unlit stone shapes)
    col = max(col, vec3(0.008, 0.012, 0.022));

    // Convert linear -> perceptual sRGB before dithering
    col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));

    // Subtle 8x8 Ordered Bayer Dither across many tonal levels
    // Shows as fine crafted texture inside warm-to-cold gradients, never a heavy screen-door
    float bayer = bayer8(lowPx) - 0.5;
    float levels = 28.0;
    vec3 quantized = floor(col * levels + 0.5 + bayer * 0.86) / levels;
    float sLum = dot(col, vec3(0.299, 0.587, 0.114));
    float gradMask = smoothstep(0.06, 0.22, sLum) * (1.0 - smoothstep(0.76, 0.97, sLum) * 0.52);
    col = mix(col, quantized, 0.14 + 0.44 * gradMask);

    // Soft vignette framing the miniature diorama
    vec2 centered = (vUv - 0.5) * vec2(1.12, 1.06);
    float vig = smoothstep(0.98, 0.30, length(centered));
    col = mix(vec3(0.018, 0.024, 0.042), col, 0.36 + 0.64 * vig);

    // Light organic film grain (24fps stepped subtle texture)
    float tStep = floor(uTime * 24.0);
    float grain = (hash12(lowPx + vec2(tStep * 13.7, tStep * 7.3)) - 0.5) * 0.024;
    col = clamp(col + grain, 0.0, 1.0);

    gl_FragColor = vec4(col, 1.0);
  }
`;

const tiltShiftMat = new THREE.ShaderMaterial({
  vertexShader: postVert,
  fragmentShader: tiltShiftFrag,
  depthTest: false,
  depthWrite: false,
  uniforms: {
    tColor: { value: sceneRT.texture },
    tDepth: { value: sceneRT.depthTexture },
    uTexelSize: { value: new THREE.Vector2(1 / lowW, 1 / lowH) },
    uNear: { value: CAM_NEAR },
    uFar: { value: CAM_FAR },
    uFocusDist: { value: 36.0 },
    uFocusY: { value: 0.5 },
  },
});

const compositeMat = new THREE.ShaderMaterial({
  vertexShader: postVert,
  fragmentShader: compositeFrag,
  depthTest: false,
  depthWrite: false,
  uniforms: {
    tDiffuse: { value: blurRT.texture },
    uLowRes: { value: new THREE.Vector2(lowW, lowH) },
    uTime: { value: 0 },
  },
});

const tiltScene = new THREE.Scene();
tiltScene.add(new THREE.Mesh(postQuadGeo, tiltShiftMat));
const compositeScene = new THREE.Scene();
compositeScene.add(new THREE.Mesh(postQuadGeo, compositeMat));

function handleResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);

  computeLowRes();
  sceneRT.dispose();
  blurRT.dispose();
  sceneRT = makeSceneRT(lowW, lowH);
  blurRT = makeBlurRT(lowW, lowH);

  tiltShiftMat.uniforms.tColor.value = sceneRT.texture;
  tiltShiftMat.uniforms.tDepth.value = sceneRT.depthTexture;
  tiltShiftMat.uniforms.uTexelSize.value.set(1 / lowW, 1 / lowH);
  compositeMat.uniforms.tDiffuse.value = blurRT.texture;
  compositeMat.uniforms.uLowRes.value.set(lowW, lowH);
}
window.addEventListener('resize', handleResize);

const fxGroup = new THREE.Group();

const sharedDebrisGeos = {

function spawnDebrisBurst(x, y, z, kind, count = 8) {
  for (let i = 0; i < count; i++) {
    let geo = sharedDebrisGeos.chip;
    let mat = sparkMat;
    if (kind === 'bone') {
      geo = i === 0 ? sharedDebrisGeos.skull : sharedDebrisGeos.bone;
      mat = MATS.bone;
    } else if (kind === 'goo') {
      geo = sharedDebrisGeos.goo;
      mat = gooMat;
    } else if (kind === 'rat') {
      geo = i < 2 ? sharedDebrisGeos.bone : sharedDebrisGeos.chip;
      mat = i < 2 ? MATS.bone : ratDustMat;
    }
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x + (Math.random() - 0.5) * 0.35, y + Math.random() * 0.4, z + (Math.random() - 0.5) * 0.35);
    const ang = Math.random() * Math.PI * 2;
    const spd = 1.6 + Math.random() * 3.2;
    const sc = 0.75 + Math.random() * 0.55;
    mesh.scale.setScalar(sc);
    fxGroup.add(mesh);
    debrisList.push({
      mesh,
      vx: Math.cos(ang) * spd,
      vy: 2.6 + Math.random() * 3.4,
      vz: Math.sin(ang) * spd,
      rx: (Math.random() - 0.5) * 12,
      ry: (Math.random() - 0.5) * 12,

    sm.position.set(x, 0.025, z);

    fxGroup.add(sm);
